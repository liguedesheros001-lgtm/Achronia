<!DOCTYPE html>

<meta name="description" content="TCG Civilisations — Jeu de cartes épique à travers les âges">
<title>TCG Civilisations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050e1a;color:#fff;font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}
button{cursor:pointer}
.screen{min-height:100vh}
#app{min-height:100vh}

/* Cards */
.card{border-radius:8px;border:2px solid #4a9eff;overflow:hidden;flex-shrink:0;position:relative;user-select:none;transition:transform 0.15s,box-shadow 0.15s;background:linear-gradient(175deg,#1e3a5f,#0a0f1e)}
.card:hover{transform:scale(1.05)}
.card.selected{border-color:#ffe066!important;transform:scale(1.07);box-shadow:0 0 14px #ffe066}
.card.glow{box-shadow:0 0 10px #ff8844}
.card-hand{width:82px;height:118px;cursor:pointer}
.card-field{width:95px;height:138px}
.card-mini{width:60px;height:87px;cursor:pointer}
.card-zoom{width:260px;height:376px}
.card-img{width:100%;height:100%;object-fit:cover;display:block}
.card-header{background:rgba(0,0,0,0.6);padding:2px 4px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(74,158,255,0.3)}
.card-name{font-size:8px;font-weight:bold;color:#c8e0ff;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-body{flex:1;display:flex;align-items:center;justify-content:center;font-size:26px}
.card-text{background:rgba(5,12,30,0.92);padding:2px 3px;font-size:7px;color:#a8c4e8;line-height:1.25;overflow:hidden}
.card-stats{background:rgba(0,0,0,0.75);display:flex;justify-content:space-around;padding:2px 0;font-size:8px}
.hp-bar-wrap{height:4px;background:#222}
.hp-bar{height:100%;transition:width 0.3s}
.stat-atk{color:#ff9999;font-weight:bold}
.stat-hp{font-weight:bold}
.stat-cost{color:#ffee88}
.badge{position:absolute;top:-6px;right:-6px;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:8px;border:1px solid #fff;z-index:2}
.last-stand{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:7px;color:#ff8844;font-weight:bold;background:rgba(0,0,0,0.7)}

/* Field */
.field-slot{width:95px;height:138px;border-radius:8px;border:1px dashed #334;background:rgba(20,30,60,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#334}
.equip-slot{width:42px;height:20px;border-radius:3px;border:1px solid #553300;background:#1a1000;display:flex;align-items:center;justify-content:center;font-size:8px;color:#886633;overflow:hidden}

/* Prestige bar */
.pbar-wrap{width:100%;height:8px;background:#111;border-radius:4px;overflow:hidden;position:relative}
.pbar-fill{height:100%;transition:width 0.4s}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;z-index:300}
.modal-box{background:linear-gradient(160deg,#0d1f3c,#050e1a);border:2px solid #4a9eff;border-radius:14px;padding:20px;max-width:580px;width:95%;max-height:85vh;overflow-y:auto}
.modal-title{color:#f0c060;font-weight:bold;font-size:15px;margin-bottom:12px;text-align:center}

/* Notif */
#notif{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(240,192,96,0.13),rgba(10,22,40,0.95));border:2px solid #f0c060;border-radius:16px;padding:16px 32px;text-align:center;z-index:550;pointer-events:none;min-width:220px;max-width:320px;display:none}
#notif.show{display:block}

/* Anim */
#anim-overlay{position:fixed;inset:0;pointer-events:none;z-index:500}

/* Deck select */
.deck-card{width:260px;background:linear-gradient(160deg,#0d1f3c,#050e1a);border:2px solid rgba(74,184,255,0.4);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;transition:transform 0.2s,box-shadow 0.2s}
.deck-card:hover{transform:scale(1.03)}
.btn-primary{background:linear-gradient(90deg,#1144aa,#2266dd);border:none;border-radius:20px;color:#fff;padding:10px 28px;font-weight:bold;font-size:14px}
.btn-danger{background:#441122;border:1px solid #aa3344;border-radius:6px;color:#fff;padding:3px 7px;font-size:9px}
.btn-small{background:#1a2a3a;border:1px solid #4466aa;border-radius:6px;color:#aaf;padding:3px 7px;font-size:9px}
.journal-entry{font-size:9px;padding:2px 4px;border-radius:3px;background:rgba(10,15,30,0.4);color:#8899aa;line-height:1.4}
.journal-entry.new{background:rgba(30,60,120,0.55);color:#ddeeff}
</style>
</head>

<script>
// ── STORAGE (défini en premier, utilisé partout) ──────────
const safeStorage={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  remove(k){try{localStorage.removeItem(k);}catch(e){}}
};

// Custom deck compositions: {deckId: {personnage:[id,...], lieu:[id,...], action:[id,...], equipement:[id,...]}}
let CUSTOM_DECKS={};
try{const s=safeStorage.get("tcg_custom_decks_v1");if(s)CUSTOM_DECKS=JSON.parse(s);}catch(e){}
const saveCustomDecks=()=>{try{safeStorage.set("tcg_custom_decks_v1",JSON.stringify(CUSTOM_DECKS));}catch(e){}};
const hasCustomDeck=(deckId)=>!!CUSTOM_DECKS[deckId];
let BOSS_WINS={};
try{const s=safeStorage.get("tcg_boss_wins_v1");if(s)BOSS_WINS=JSON.parse(s);}catch(e){}
const saveBossWins=()=>{try{safeStorage.set("tcg_boss_wins_v1",JSON.stringify(BOSS_WINS));}catch(e){}};
const getBossWins=(id)=>BOSS_WINS[id]||0;
const incBossWins=(id)=>{BOSS_WINS[id]=(BOSS_WINS[id]||0)+1;saveBossWins();};
const isBossUnlocked=(deckId)=>{
  const dk=DECKS[deckId];if(!dk?.bossOnly)return true;
  if(!dk.bossUnlockBoss)return true;// Roi du Temps: always available
  return getBossWins(dk.bossUnlockBoss)>=dk.bossUnlockWins;
};
let STARTER_PACK=null;
try{const s=safeStorage.get("tcg_starter_pack_v1");if(s)STARTER_PACK=s;}catch(e){}
const saveStarterPack=id=>{STARTER_PACK=id;try{safeStorage.set("tcg_starter_pack_v1",id);}catch(e){}};

// Mapping pack → decks débloqués par défaut
const PACK_TO_DECKS={
  amazones:["amazones","primitifs"],
  amerindiens:["amerindiens","primitifs"],
  grecs:["grecs","empire"],
  egyptiens:["egyptiens","empire"],
  pirates:["pirates","navigateurs"],
  vikings:["vikings","navigateurs"],
};
// Factions requises par deck pour calcul 85%
const DECK_REQ_FACTIONS={
  vikings:["Vikings"],pirates:["Pirates"],navigateurs:["Vikings","Pirates"],
  amazones:["Amazones"],amerindiens:["Amerindiens"],primitifs:["Amazones","Amerindiens"],
  egyptiens:["Egyptiens"],grecs:["Grecs"],empire:["Egyptiens","Grecs"],
  ninjas:["Ninjas"],empoisonneurs:["Empoisonneurs"],corrompus:["Ninjas","Empoisonneurs"],
  steampunk:["Steampunk"],robots:["Robots"],punk:["Punk"],deckperso:["Neutre"],
  industriels:["Robots","Steampunk"],
};

const isDeckStarterUnlocked=(deckId)=>{
  if(!STARTER_PACK)return false;
  return(PACK_TO_DECKS[STARTER_PACK]||[]).includes(deckId);
};

const getDeckCollectionPct=(deckId)=>{
  const factions=DECK_REQ_FACTIONS[deckId]||[];
  if(!factions.length)return 0;
  const allCards=CARDS.filter(c=>factions.includes(c.faction)&&!c.isFusion&&!c.isChronoLegendaire&&!c.isSortEvolution&&c.type!=="trophee");
  if(!allCards.length)return 0;
  const owned=allCards.filter(c=>(COLLECTION[c.id]||0)>0).length;
  return owned/allCards.length;
};

// Un deck est jouable si: starter OU 85%+ collection
const isDeckPlayable=(deckId)=>{
  const dk=DECKS[deckId];
  if(!dk||dk.bossOnly||dk.locked)return false;
  if(dk.alwaysPlayable)return true;
  if(isDeckStarterUnlocked(deckId))return true;
  return getDeckCollectionPct(deckId)>=0.85;
};

// Returns true if the player's current game deck has ≥20 cards of a faction
const deckHas20Faction=(faction)=>{
  if(!G)return false;
  const all=[...G.player.deck,...G.player.hand,...G.player.field.filter(c=>c),...G.player.discard];
  return all.filter(c=>c.faction===faction).length>=20;
};

const checkGradeCondition=(faction,gradeIdx)=>{
  const stats=FACTION_STATS[faction]||{};
  switch(gradeIdx){
    case 0:return(stats.wins||0)>=10;
    case 1:return(stats.kills||0)>=100;
    case 2:return(stats.wins3alive||0)>=20;
    case 3:return(stats.wins||0)>=30;
    case 4:return(stats.winsHighCost||0)>=30;
    case 5:return(stats.diffStreak||0)>=15;
    case 6:return(stats.winsNoDmg||0)>=10;
    case 7:return(stats.winsNoHigh||0)>=20;
    case 8:{const beaten=stats.factionsBeatDiff||{};return Object.values(beaten).filter(n=>n>=10).length>=10;}
    case 9:return(stats.winsHardest||0)>=20;
  }
  return false;
};

    case 1:return{val:stats.kills||0,max:100};
    case 2:return{val:stats.wins3alive||0,max:20};
    case 3:return{val:stats.wins||0,max:30};
    case 4:return{val:stats.winsHighCost||0,max:30};
    case 5:return{val:stats.diffStreak||0,max:15};
    case 6:return{val:stats.winsNoDmg||0,max:10};
    case 7:return{val:stats.winsNoHigh||0,max:20};
    case 8:{const beaten=stats.factionsBeatDiff||{};return{val:Object.values(beaten).filter(n=>n>=10).length,max:10};}
    case 9:return{val:stats.winsHardest||0,max:20};
  }
  return{val:0,max:1};
};

// Update grades for a faction (call after stats change)
const updateGrades=(faction)=>{
  const current=GRADES[faction]||0;
  let g=current;
  while(g<10&&checkGradeCondition(faction,g)){g++;}
  if(g!==current){
    GRADES[faction]=g;
    saveGrades();
    // Check avatar unlock
    checkChronoAvatarUnlock(faction);
    return true;// grade changed
  }
  return false;
};

const getEligibleChrono=()=>{
  const eligible=[];
  for(const [faction,list] of Object.entries(CHRONO_LEGENDAIRES)){

    list.forEach(({id,grade})=>{
      if(grade<=fGrade&&!(COLLECTION[id]&&COLLECTION[id]>0)){

  return eligible;
};

const openBoosterNE=()=>{
  const pack=SHOP_PACK_DEFS.find(p=>p.id==="booster");
  if(!pack)return null;
  if(PLAYER_STATS.coins<pack.price)return{error:"Pas assez de pièces !"};

  // Pick 4 cards based on cost tiers (neCost permet de surclasser le coût réel pour le drop)
  const neCards=CARDS.filter(c=>NE_CARD_IDS.includes(c.id));
  const tier1=neCards.filter(c=>(c.neCost||c.cost||0)>=1&&(c.neCost||c.cost||0)<=3);
  const tier2=neCards.filter(c=>(c.neCost||c.cost||0)>=4&&(c.neCost||c.cost||0)<=6);
  const tier3=neCards.filter(c=>(c.neCost||c.cost||0)>=7&&(c.neCost||c.cost||0)<=9);
  const tier4=neCards.filter(c=>(c.neCost||c.cost||0)>=10);
  const pickTier=()=>{
    const r=Math.random();
    if(r<0.59)return tier1;
    if(r<0.89)return tier2;
    if(r<0.99)return tier3;
    return tier4;
  };
  const pick=(arr)=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;

  // Rareté selon le tier tiré
  const tierRarity=(pool)=>{
    if(pool===tier1)return"common";
    if(pool===tier2)return"rare";
    if(pool===tier3)return"prestige";
    return"legendaire";
  };

  const cards=[];
  for(let i=0;i<4;i++){
    const pool=pickTier();
    const chosen=pool.length?pool:tier1;
    const c=pick(chosen);
    if(c)cards.push({...c,rarity:tierRarity(chosen)});
  }

  // Prestige slot: roll for unlocked chrono-légendaires not yet owned
  const eligible=getEligibleChrono();
  for(const cl of eligible){
    const chance=(11-cl.grade)/100;// grade 1 → 10%, grade 10 → 1%
    if(Math.random()<chance){
      const clCard=CARDS.find(c=>c.id===cl.id);
      if(clCard){cards.push({...clCard,rarity:"prestige",isChronoLegendaire:true});break;}
    }
  }

  cards.forEach(c=>{
    c.isNew=(COLLECTION[c.id]||0)===0;
    COLLECTION[c.id]=(COLLECTION[c.id]||0)+1;
  });
  // Check avatar after getting a chrono-légendaire
  for(const faction of Object.keys(CHRONO_LEGENDAIRES))checkChronoAvatarUnlock(faction);

  PLAYER_STATS.coins-=pack.price;
  saveStats();saveCollection();
  // Update collection-based grades after buying
  for(const f of GRADES_FACTIONS)updateGrades(f);
  return{cards,isBoosterNE:true};
};

let _actx=null;
const getACtx=()=>{if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();return _actx;};

const playTone=(freq,type,duration,vol=0.18,decay=0.9)=>{
  try{
    const ctx=getACtx();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+duration);
  }catch(e){}
};

const playNoise=(duration,vol=0.12)=>{
  try{
    const ctx=getACtx();
    const buf=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource();src.buffer=buf;
    const g=ctx.createGain();src.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);
    src.start();src.stop(ctx.currentTime+duration);
  }catch(e){}
};

  side.field.forEach(c=>{if(c)counts[c.faction]=(counts[c.faction]||0)+1;});

  Object.entries(counts).forEach(([faction,count])=>{
    if(count<3)return;
    SFX.trioLaugh();
    showTrioAnim(faction);
    if(isP){GAME_TRACK.trio++;progressChallenge("trio");incFactionStat(faction,"trios");updateGrades(faction);}

    if(faction==="Pirates"){
      if(G[en].hand.length>0){
        const idx=Math.floor(Math.random()*G[en].hand.length);
        const stolen=G[en].hand.splice(idx,1)[0];
        G[who].hand.push({...stolen,uid:mkuid()});
        addLog("⚓ TRIO PIRATES ! "+(isP?"Vous volez":"IA vole")+" une carte !");
      } else addLog("⚓ TRIO PIRATES ! Main adverse vide.");

    } else if(faction==="Vikings"){
      side.field.forEach(c=>{
        if(c&&c.faction==="Vikings")G.fx.push({target:c.uid,bonus:100,type:"atk",endOfTurn:true});
      });
      addLog("⚡ TRIO VIKINGS ! Tous les Vikings +100 ATK !");

    } else if(faction==="Amazones"){
      [...G[en].field].forEach((c,i)=>{
        if(!c||!G[en].field[i])return;
        if((c.dmgTaken||0)>0){
          const ch=curHp(G[en].field[i],G[en],G.fx,G.lieu);
          if(100>=ch){killCard(en,i);stealPrestige(who,"Trio Amazones détruit "+c.name+"!");}
          else{G[en].field[i]={...G[en].field[i],dmgTaken:(G[en].field[i].dmgTaken||0)+100};addLog("🌿 Trio Amazones: "+c.name+" -100 PV !");}
        }
      });

    } else if(faction==="Amerindiens"){
      [...G[en].field].forEach((c,i)=>{
        if(!c||!G[en].field[i])return;
        const ch=curHp(G[en].field[i],G[en],G.fx,G.lieu);
        if(100>=ch){killCard(en,i);stealPrestige(who,"Trio Amérindiens détruit "+c.name+"!");}
        else{G[en].field[i]={...G[en].field[i],dmgTaken:(G[en].field[i].dmgTaken||0)+100};addLog("🪶 Trio Amérindiens: "+c.name+" -100 PV !");}
      });

    } else if(faction==="Grecs"){
      if(isP){
        const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);
        if(opts.length){
          setTimeout(()=>{CHOICE={type:"trio_grecs",options:opts};renderGame();},400);
        }
      } else {
        // IA: gèle le personnage avec le plus d'ATK
        const strongest=G.player.field.reduce((best,c,i)=>{
          if(!c)return best;
          return(!best||calcAtk(c,G.player,G.fx,G.lieu,true)>calcAtk(best.c,G.player,G.fx,G.lieu,true))?{c,i}:best;
        },null);
        if(strongest){G.frozenChars.push(strongest.c.uid);addLog("🏛️ TRIO GRECS IA ! "+strongest.c.name+" gelé !");}
      }

    } else if(faction==="Egyptiens"){
      G[en].field.forEach(c=>{
        if(c)G.fx.push({target:c.uid,bonus:-100,type:"atk",endOfTurn:true});
      });
      addLog("🏺 TRIO ÉGYPTIENS ! Tous les ennemis -100 ATK !");
    } else if(faction==="Ninjas"){
      // Trio Ninjas: active le rappel de fin de tour (géré dans doEndTurn)
      if(isP){G.ninjaTrio=true;addLog("🥷 TRIO NINJAS ! Vous pourrez rappeler un Ninja en main en fin de tour !");}
      else{// IA: le ninja le plus blessé récupère ses PV
        const ninjas=G.ai.field.filter(c=>c&&c.faction==="Ninjas");
        if(ninjas.length>0){const worst=ninjas.reduce((a,b)=>curHp(b,G.ai,G.fx,G.lieu)<curHp(a,G.ai,G.fx,G.lieu)?b:a);const wi=G.ai.field.findIndex(c=>c&&c.uid===worst.uid);if(wi!==-1){G.ai.field[wi]=null;G.ai.equips[wi]=[null,null];G.ai.hand.push({...worst,dmgTaken:0,bonusAtk:0,bonusHp:0,hasAttacked:false,_poisoned:false,uid:mkuid()});addLog("🥷 TRIO NINJAS IA ! "+worst.name+" rappelé en main (PV rechargés)!");}}
      }
    } else if(faction==="Robots"){
      // Trio Robots : une fois par tour, quand un Robot allié devrait être détruit, un autre Robot allié meurt à la place
      if(isP){G.robotShield=true;addLog("🤖 TRIO ROBOTS — Ingénierie Défensive ! Un autre Robot mourra à votre place si vous êtes détruits !");}
      else{G.robotShieldAi=true;addLog("🤖 TRIO ROBOTS IA — Ingénierie Défensive activée !");}
    } else if(faction==="Extraterrestres"){
      if(G[who].prestige<G[en].prestige&&G[en].hand.length>0){const idx=Math.floor(Math.random()*G[en].hand.length);const stolen=G[en].hand.splice(idx,1)[0];G[who].hand.push({...stolen,uid:mkuid()});addLog("👽 TRIO EXTRATERRESTRES ! Carte volée !");}else addLog("👽 TRIO EXTRATERRESTRES ! Pas de vol possible.");
    } else if(faction==="MagesNoirs"){
      const tgt=G[en].field.filter(c=>c);if(tgt.length){const t=tgt.reduce((a,b)=>calcAtk(b,G[en],G.fx,G.lieu,!isP)>calcAtk(a,G[en],G.fx,G.lieu,!isP)?b:a);G.fx.push({target:t.uid,bonus:-200,type:"atk",endOfTurn:true});addLog("🔮 TRIO MAGES NOIRS ! "+t.name+" -200 ATK !");}
    } else if(faction==="Fantomes"){
      if(isP){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length)setTimeout(()=>{CHOICE={type:"trio_grecs",options:opts,trioLabel:"👻 TRIO FANTÔMES"};renderGame();},400);}else{const si=G.player.field.findIndex(c=>c);if(si!==-1){G.frozenChars.push(G.player.field[si].uid);addLog("👻 TRIO FANTÔMES IA ! "+G.player.field[si].name+" gelé !");}}
    } else if(faction==="Pyromanes"){
      [...G[en].field].forEach((c,i)=>{if(!c||!G[en].field[i])return;const ch=curHp(G[en].field[i],G[en],G.fx,G.lieu);if(150>=ch){killCard(en,i);stealPrestige(who,"Trio Pyromanes détruit "+c.name+"!");}else{G[en].field[i]={...G[en].field[i],dmgTaken:(G[en].field[i].dmgTaken||0)+150};addLog("🔥 Trio Pyromanes: "+c.name+" -150 PV!");}});
    } else if(faction==="MaîtresBêtes"){
      const al=side.field.filter(c=>c&&!c._maitresBetesTrioBonus);
      if(al.length){const strongest=al.reduce((a,b)=>calcAtk(b,G[who],G.fx,G.lieu,isP)>calcAtk(a,G[who],G.fx,G.lieu,isP)?b:a);strongest.bonusHp=(strongest.bonusHp||0)+200;strongest._maitresBetesTrioBonus=true;addLog("🐾 TRIO MAÎTRES ! "+strongest.name+" +200 PV !");}
    } else if(faction==="DresseursDragons"){
      G.papyActive=true;addLog("🐉 TRIO DRESSEURS ! Prochain Dresseur allié +200 PV !");
    } else if(faction==="Steampunk"){
      // Ingénierie Collective: Steampunk équipés +150 PV (1x par carte, pas de cumul si le trio reste actif plusieurs tours)
      let n=0;
      side.field.forEach((c,i)=>{
        if(c&&c.faction==="Steampunk"&&!c._steampunkTrioBonus&&eqs(G[who].equips,c.uid).some(e=>e)){
          c.bonusHp=(c.bonusHp||0)+150;c._steampunkTrioBonus=true;n++;
        }
      });
      if(n>0)addLog("⚙️ TRIO STEAMPUNK — Ingénierie Collective ! "+n+" Steampunk équipé(s) +150 PV !");
    } else if(faction==="Empoisonneurs"){
      // Trio Empoisonneurs: passif actif — quand un ennemi est empoisonné, un autre perd 50 PV
      if(isP){G.empoisonneurTrio=true;addLog("☠️ TRIO EMPOISONNEURS actif ! Chaque ennemi empoisonné propagera 50 PV à un autre !");}
    }
  });
};

// Queue: [{text, subtext, icon, type, duration}]
// types: "play" | "attack" | "power" | "destroy" | "damage" | "effect"
let AI_ANNOUNCE_QUEUE=[];
let AI_ANNOUNCE_RUNNING=false;

const ANNOUNCE_COLORS={
  play:"#4a9eff",attack:"#ff6644",power:"#cc88ff",destroy:"#ff3333",
  damage:"#ff8800",effect:"#55bb22",info:"#8899aa"
};
const ANNOUNCE_ICONS={
  play:"🃏",attack:"⚔️",power:"✨",destroy:"💀",damage:"💥",effect:"⚡",info:"ℹ️"
};

const queueAiAnnounce=(text,type="info",subtext="",duration=1600)=>{
  AI_ANNOUNCE_QUEUE.push({text,subtext,type,duration});
};

const showAnnounce=({text,subtext,type,duration},cb)=>{
  const el=document.getElementById("ai-announce");
  if(!el){setTimeout(cb,0);return;}// ← setTimeout breaks synchronous recursion
  const color=ANNOUNCE_COLORS[type]||"#8899aa";
  const icon=ANNOUNCE_ICONS[type]||"ℹ️";
  el.style.cssText=`position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(2,8,20,0.97);border:2px solid ${color};border-radius:18px;
    padding:18px 28px;text-align:center;z-index:500;
    min-width:240px;max-width:340px;
    box-shadow:0 0 40px ${color}55;
    animation:aiAnnounceIn 0.25s ease forwards;`;
  el.innerHTML=`
    <div style="font-size:28px;margin-bottom:6px">${icon}</div>
    <div style="font-size:13px;font-weight:bold;color:${color};line-height:1.5">${text}</div>
    ${subtext?`<div style="font-size:11px;color:#667799;margin-top:5px">${subtext}</div>`:""}`;
  if(type==="attack"||type==="destroy")try{SFX.attack&&SFX.attack();}catch(e){}
  setTimeout(()=>{
    el.style.animation="aiAnnounceOut 0.2s ease forwards";
    setTimeout(cb,220);
  },duration);
};

const flushAiAnnounce=(onDone)=>{
  if(!AI_ANNOUNCE_QUEUE.length){
    AI_ANNOUNCE_RUNNING=false;
    const el=document.getElementById("ai-announce");
    if(el)el.style.cssText="display:none";
    setTimeout(onDone,0);// setTimeout prevents deep call stacks
    return;
  }
  AI_ANNOUNCE_RUNNING=true;
  const item=AI_ANNOUNCE_QUEUE.shift();
  renderGame();
  setTimeout(()=>{
    showAnnounce(item,()=>{flushAiAnnounce(onDone);});
  },80);
};

// ── DOT EFFECTS ENGINE (Empoisonneurs) ─────────────────
// dotEffects: [{uid, side, dmgHp, atkPen, turnsLeft}]
// side = owner of the poisoned card ("player" or "ai")
// turnsLeft: -1 = infinite, N = N turns remaining
const applyDotEffects=(side)=>{
  if(!G||!G.dotEffects)return;
  const en=side==="player"?"ai":"player";
  const toRemove=[];
  G.dotEffects.forEach((dot,di)=>{
    if(dot.side!==side)return;
    const fi=G[side].field.findIndex(c=>c&&c.uid===dot.uid);
    if(fi===-1){toRemove.push(di);return;}
    const card=G[side].field[fi];
    const hasImmunity=eqs(G[side].equips,card.uid).find(e=>e&&e.id==="technomasquepeste");
    if(hasImmunity){toRemove.push(di);return;}
    if(dot.dmgHp>0){const ch=curHp(card,G[side],G.fx,G.lieu);if(dot.dmgHp>=ch){killCard(side,fi);stealPrestige(en,"☠ Poison détruit "+card.name+"!");toRemove.push(di);return;}else{G[side].field[fi]={...card,dmgTaken:(card.dmgTaken||0)+dot.dmgHp};addLog("☠ Poison: "+card.name+" -"+dot.dmgHp+" PV");}}
    if(dot.atkPen>0){G.fx.push({target:dot.uid,bonus:-dot.atkPen,type:"atk",endOfTurn:true});addLog("☠ Poison: "+card.name+" -"+dot.atkPen+" ATK");}
    if(dot.turnsLeft>0){dot.turnsLeft--;if(dot.turnsLeft===0)toRemove.push(di);}
  });
  for(let i=toRemove.length-1;i>=0;i--)G.dotEffects.splice(toRemove[i],1);
  // Aiguille de Contamination: recurring ATK debuff
  (G.enemyEquips||[]).forEach(eq=>{
    if(eq.id!=="aiguillecontam"||eq.side!==side)return;
    const fi=G[side].field.findIndex(c=>c&&c.uid===eq.targetUid);
    if(fi!==-1&&G[side].field[fi]){G.fx.push({target:eq.targetUid,bonus:-100,type:"atk",endOfTurn:true});addLog("☠ Aiguille: "+G[side].field[fi].name+" -100 ATK");}
    else G.enemyEquips=G.enemyEquips.filter(e=>e!==eq);
  });
  // Reine du Poison Noir passif
  if(side==="ai"&&G.player.field.some(c=>c&&c.id==="reinepoisonnoir")){
    G.ai.field.forEach((c,i)=>{if(!c||!c._poisoned)return;if(eqs(G.ai.equips,c.uid).find(e=>e&&e.id==="technomasquepeste"))return;const ch=curHp(c,G.ai,G.fx,G.lieu);if(50>=ch){killCard("ai",i);stealPrestige("player","Reine Poison: "+c.name+" détruit!");}else if(G.ai.field[i]){G.ai.field[i]={...c,dmgTaken:(c.dmgTaken||0)+50};G.fx.push({target:c.uid,bonus:-50,type:"atk",endOfTurn:true});addLog("👑 Reine Poison: "+c.name+" -50 PV -50 ATK");}});
  }
  if(side==="player"&&G.ai.field.some(c=>c&&c.id==="reinepoisonnoir")){
    G.player.field.forEach((c,i)=>{if(!c||!c._poisoned)return;if(eqs(G.player.equips,c.uid).find(e=>e&&e.id==="technomasquepeste"))return;const ch=curHp(c,G.player,G.fx,G.lieu);if(50>=ch){killCard("player",i);stealPrestige("ai","Reine Poison IA: "+c.name+" détruit!");}else if(G.player.field[i]){G.player.field[i]={...c,dmgTaken:(c.dmgTaken||0)+50};G.fx.push({target:c.uid,bonus:-50,type:"atk",endOfTurn:true});addLog("👑 Reine Poison IA: "+c.name+" -50 PV -50 ATK");}});
  }
  // Égouts Toxiques: at start of AI turn
  if(side==="ai"&&G.lieu&&G.lieu.id==="egouttox"){
    [...G.ai.field].forEach((c,i)=>{if(!c||!G.ai.field[i])return;if(eqs(G.ai.equips,c.uid).find(e=>e&&e.id==="technomasquepeste"))return;const ch=curHp(G.ai.field[i],G.ai,G.fx,G.lieu);if(50>=ch){killCard("ai",i);stealPrestige("player","Égouts: "+c.name+" détruit!");}else if(G.ai.field[i]){G.ai.field[i]={...G.ai.field[i],dmgTaken:(G.ai.field[i].dmgTaken||0)+50};if(c._poisoned)G.fx.push({target:c.uid,bonus:-50,type:"atk",endOfTurn:true});}});addLog("🏚️ Égouts Toxiques: ennemis -50 PV !");
  }
};

// Poison a character: mark _poisoned and add dotEffect
const poisonChar=(side,uid,dmgHp,turnsLeft=-1,atkPen=0)=>{
  const fi=G[side].field.findIndex(c=>c&&c.uid===uid);
  if(fi===-1)return;
  G[side].field[fi]={...G[side].field[fi],_poisoned:true};
  G.dotEffects.push({uid,side,dmgHp,atkPen,turnsLeft});
  // Trio Empoisonneurs passif: quand un ennemi est empoisonné → un autre ennemi aléatoire perd 50 PV
  const en=side;
  if(G.empoisonneurTrio&&en==="ai"){
    const others=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.uid!==uid);
    if(others.length>0){
      const target=others[Math.floor(Math.random()*others.length)];
      const tch=curHp(target.c,G.ai,G.fx,G.lieu);
      if(50>=tch){killCard("ai",target.i);stealPrestige("player","Propagation poison détruit "+target.c.name+"!");}
      else{G.ai.field[target.i]={...target.c,dmgTaken:(target.c.dmgTaken||0)+50};addLog("☠️ Propagation: "+target.c.name+" -50 PV !");}
    }
  }
};

const loadDailyChallenges=()=>{
  try{
    const s=safeStorage.get("tcg_daily_v1");
    if(s){
      const d=JSON.parse(s);
      if(d.date===todayKey())return d;
    }
  }catch(e){}
  // Generate 10 new challenges for today using date as seed
  const seed=todayKey().replace(/-/g,"");
  let rng=parseInt(seed)%999983;
  const seededRand=()=>{rng=(rng*16807+0)%2147483647;return rng/2147483647;};
  const shuffled=[...ALL_CHALLENGES].sort(()=>seededRand()-0.5);
  const picked=shuffled.slice(0,10);
  const daily={date:todayKey(),challenges:picked.map(c=>({...c,progress:0,done:false}))};
  safeStorage.set("tcg_daily_v1",JSON.stringify(daily));
  return daily;
};

let GAME_TRACK={kills:0,kills_game:0,play_chars:0,use_actions:0,prestige_reached:0,trio:0,fusion:false,fusion_on_field:false,equip:0,decks_won:new Set()};

const progressChallenge=(type,value=1)=>{
  if(!DAILY)return;
  let updated=false;
  DAILY.challenges.forEach(ch=>{
    if(ch.done||ch.type!==type)return;
    // Check difficulty filter
    if(ch.diff&&MATCHUP?.difficulty!==ch.diff)return;
    if(type==="prestige"&&value<ch.target)return;
    if(type==="win_quick"&&value>ch.target)return;
    if(type==="prestige"){ch.progress=ch.target;ch.done=true;updated=true;return;}
    if(type==="win_quick"){ch.progress=ch.target;ch.done=true;updated=true;return;}
    ch.progress=Math.min(ch.target,ch.progress+1);
    if(ch.progress>=ch.target){ch.done=true;}
    updated=true;
  });
  if(updated){
    saveDailyChallenges();
    // Give rewards for newly completed challenges
    DAILY.challenges.forEach(ch=>{
      if(ch.done&&!ch._rewarded){
        ch._rewarded=true;
        PLAYER_STATS.coins+=ch.coins;
        PLAYER_STATS.xp+=ch.xp;
        let leveled=false;
        while(true){const needed=xpForLevel(PLAYER_STATS.level+1);if(PLAYER_STATS.xp>=needed){PLAYER_STATS.xp-=needed;PLAYER_STATS.level++;leveled=true;}else break;}
        saveStats();saveDailyChallenges();
        if(leveled)setTimeout(()=>SFX.levelUp(),500);
        showChallengeComplete(ch);
      }
    });
  }
};

const xpForLevel=lvl=>{
  let req=500;for(let i=2;i<lvl;i++)req=Math.round(req*1.4);return req;
};

const applyReward=diff=>{
  const table={facile:{coins:50,xp:50},moyen:{coins:100,xp:100},difficile:{coins:200,xp:200}};
  const r=table[diff]||{coins:50,xp:50};
  PLAYER_STATS.coins+=r.coins;
  PLAYER_STATS.xp+=r.xp;
  let leveled=false;
  while(true){
    const needed=xpForLevel(PLAYER_STATS.level+1);
    if(PLAYER_STATS.xp>=needed){PLAYER_STATS.xp-=needed;PLAYER_STATS.level++;leveled=true;}
    else break;
  }
  saveStats();
  return{...r,leveled};
};

// ── DECK BUILDER ─────────────────────────────────────────
let DB_STATE={deckId:null,selected:{personnage:[],lieu:[],action:[],equipement:[]},tab:"personnage",sorts:[]};

window.openDeckBuilder=(deckId)=>{
  const existing=CUSTOM_DECKS[deckId];
  const savedSorts=JSON.parse(safeStorage.get("tcg_deck_sorts_v1")||"{}");
  DB_STATE={
    deckId,
    selected:existing?JSON.parse(JSON.stringify(existing)):{personnage:[],lieu:[],action:[],equipement:[]},
    tab:"personnage",
    sorts:savedSorts[deckId]||[]
  };
  SCREEN="deckbuilder";render();
};

window.dbSetTab=(tab)=>{DB_STATE.tab=tab;render();};

window.dbToggleCard=(cardId)=>{
  const tab=DB_STATE.tab;
  const SLOT_MAX={personnage:20,lieu:2,action:10,equipement:8};
  const arr=DB_STATE.selected[tab];
  const max=SLOT_MAX[tab]||20;
  const owned=COLLECTION[cardId]||0;
  if(owned<=0){showNotif("Tu ne possèdes pas cette carte !","#ff4444","🔒");return;}
  const alreadySelected=arr.filter(id=>id===cardId).length;

  if(alreadySelected>0){
    // Si toutes les copies possédées sont déjà sélectionnées → désélectionner une
    if(alreadySelected>=owned){
      arr.splice(arr.lastIndexOf(cardId),1);
    } else {
      // Ajouter une copie de plus
      if(arr.length>=max){showNotif(`Maximum ${max} ${tab}s !`,"#ff4444","⚠️");return;}
      arr.push(cardId);
    }
  } else {
    if(arr.length>=max){showNotif(`Maximum ${max} ${tab}s !`,"#ff4444","⚠️");return;}
    arr.push(cardId);
  }
  render();
};

window.dbToggleCL=(cardId)=>{
  const arr=DB_STATE.selected.personnage;
  const clSelected=arr.filter(id=>{const c=CARDS.find(x=>x.id===id);return c&&c.isChronoLegendaire;});
  const idx=arr.indexOf(cardId);
  if(idx!==-1){arr.splice(idx,1);}
  else{
    if(clSelected.length>=3){showNotif("Maximum 3 Chrono-Légendaires par deck !","#cc88ff","✨");return;}
    if(arr.length>=20){showNotif("Maximum 20 personnages !","#ff4444","⚠️");return;}
    arr.push(cardId);
  }
  render();
};

window.dbToggleSort=(sort)=>{
  const arr=DB_STATE.sorts||[];
  const idx=arr.indexOf(sort);
  if(idx!==-1){DB_STATE.sorts=arr.filter(s=>s!==sort);}
  else{
    if(arr.length>=3){showNotif("Maximum 3 sorts par deck !","#ff8800","⚡");return;}
    DB_STATE.sorts=[...arr,sort];
  }
  render();
};

window.dbSave=()=>{
  CUSTOM_DECKS[DB_STATE.deckId]=JSON.parse(JSON.stringify(DB_STATE.selected));
  saveCustomDecks();
  // Sauvegarde des sorts
  const savedSorts=JSON.parse(safeStorage.get("tcg_deck_sorts_v1")||"{}");
  savedSorts[DB_STATE.deckId]=DB_STATE.sorts||[];
  safeStorage.set("tcg_deck_sorts_v1",JSON.stringify(savedSorts));
  showNotif("✅ Deck sauvegardé !","#44cc88","🛠");
  SCREEN="deckselect";render();
};

  DB_STATE.selected={personnage:[],lieu:[],action:[],equipement:[]};

};

const goToPlay=()=>{
  const playable=Object.keys(DECKS).filter(id=>isDeckPlayable(id)&&!DECKS[id].bossOnly);
  if(playable.length===0){
    SCREEN="opponentselect";renderOpponentSelect();
    return;
  }
  if(playable.length===1){
    DECK_IDS.player=playable[0];
    SCREEN="opponentselect";renderOpponentSelect();
    return;
  }
  // Priorité 1 : dernier deck sauvegardé
  const lastDeck=safeStorage.get("tcg_last_deck_v1");
  if(lastDeck&&playable.includes(lastDeck)){
    DECK_IDS.player=lastDeck;
    SCREEN="opponentselect";renderOpponentSelect();
    return;
  }
  // Priorité 2 : deck correspondant au starter pack (choix initial définitif)
  if(STARTER_PACK&&playable.includes(STARTER_PACK)){
    DECK_IDS.player=STARTER_PACK;
    safeStorage.set("tcg_last_deck_v1",STARTER_PACK);
    SCREEN="opponentselect";renderOpponentSelect();
    return;
  }
  // Priorité 3 : premier deck jouable
  if(playable.length>0){
    DECK_IDS.player=playable[0];
    safeStorage.set("tcg_last_deck_v1",playable[0]);
    SCREEN="opponentselect";renderOpponentSelect();
    return;
  }
  SCREEN="deckselect";render();
};
window.goToPlay=goToPlay;

window.confirmStarterPack=(id)=>{
  const p=STARTER_CHOICES.find(x=>x.id===id);
  if(!p)return;
  saveStarterPack(id);
  // Reset collection complètement (nouveau départ propre)
  COLLECTION={};
  // Give ONLY starter faction + neutral
  CARDS.forEach(c=>{
    if((p.factions.includes(c.faction)||c.faction==="Neutre")&&!c.isFusion&&!c.isChronoLegendaire){
      COLLECTION[c.id]=1;
    }
  });
  PLAYER_STATS.coins=700;
  saveStats();saveCollection();
  safeStorage.set("tcg_last_deck_v1",id);
  DECK_IDS.player=id;
  SCREEN="opponentselect";renderOpponentSelect();
};

// MUSIC ENGINE — Générateur de musique épique procédurale
// ═══════════════════════════════════════════════════════
const MUSIC=(()=>{
  let ctx=null,master=null,reverb=null,playing=false,timeoutId=null,barIdx=0;
  let vol=0.20;

  // 104 BPM, temps plus posé et plus solennel
  const BPM=104, BEAT=60/BPM, BAR=BEAT*4;

  // Progression harmonieuse : Dm - Bb - F - C (relative majeur de mineur, très épique)
  const CHORDS=[
    {root:146.83, notes:[146.83,174.61,220.00,261.63]},  // Dm
    {root:116.54, notes:[116.54,146.83,174.61,233.08]},  // Bb
    {root:174.61, notes:[174.61,220.00,261.63,329.63]},  // F
    {root:130.81, notes:[130.81,164.81,196.00,261.63]},  // C
  ];

  const init=()=>{
    if(ctx)return;
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=vol;
    // Reverb via convolution (simulé par delay + filtre passe-bas)
    const dly=ctx.createDelay(0.5);dly.delayTime.value=0.38;
    const dlyG=ctx.createGain();dlyG.gain.value=0.14;
    const filt=ctx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=2800;filt.Q.value=0.8;
    const dly2=ctx.createDelay(0.3);dly2.delayTime.value=0.22;
    const dlyG2=ctx.createGain();dlyG2.gain.value=0.08;
    master.connect(filt);filt.connect(ctx.destination);
    master.connect(dly);dly.connect(dlyG);dlyG.connect(filt);
    master.connect(dly2);dly2.connect(dlyG2);dlyG2.connect(filt);
  };

  const note=(freq,t,dur,type="sine",v=0.07,det=0,attack=0.04)=>{
    try{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(master);
      o.type=type;o.frequency.value=freq;if(det)o.detune.value=det;
      const atk=Math.min(attack,dur*0.15);
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(v,t+atk);
      g.gain.setValueAtTime(v*0.85,t+atk+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.95);
      o.start(t);o.stop(t+dur+0.08);
    }catch(e){}
  };

  const kick=(t,v=0.55)=>{
    try{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(master);
      o.frequency.setValueAtTime(120,t);
      o.frequency.exponentialRampToValueAtTime(40,t+0.22);
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.start(t);o.stop(t+0.45);
    }catch(e){}
  };

  const snare=(t)=>{
    try{
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.14,ctx.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=ctx.createBufferSource();src.buffer=buf;
      const f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=0.6;
      const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(master);
      g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      src.start(t);src.stop(t+0.18);
      note(185,t,0.05,"triangle",0.12); // corpo du snare
    }catch(e){}
  };

  const hihat=(t,open=false)=>{
    try{
      const buf=ctx.createBuffer(1,ctx.sampleRate*(open?0.12:0.03),ctx.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const src=ctx.createBufferSource();src.buffer=buf;
      const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=10000;
      const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(master);
      g.gain.setValueAtTime(open?0.06:0.035,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+(open?0.1:0.025));
      src.start(t);src.stop(t+0.15);
    }catch(e){}
  };

  // Mélodie principale : gamme pentatonique mineure de Ré
  // D E F A Bb D' E' F' A' — douce et épique
  const MELODIES=[
    // Mélodie A : montante et descendante
    [[293.66,0],[329.63,0.5],[349.23,0.5],[440,1],[392,0.5],[349.23,0.5],[329.63,1.5],[293.66,0.5]],
    // Mélodie B : ornementée
    [[440,0],[392,0.25],[440,0.25],[523.25,1],[493.88,0.5],[440,0.5],[392,1],[349.23,1]],
    // Mélodie C : grave et solennelle
    [[220,0],[246.94,0.5],[261.63,0.5],[293.66,1],[329.63,0.5],[293.66,0.5],[261.63,1.5],[220,0.5]],
  ];

  // Contre-chant : voix haute complémentaire
  const COUNTER=[
    [[587.33,0],[523.25,1],[587.33,0.5],[659.25,0.5],[587.33,1.5],[523.25,0.5]],
    [[659.25,0],[587.33,0.5],[523.25,0.5],[587.33,1],[659.25,0.5],[587.33,0.5],[523.25,1.5]],
  ];

  const playBar=(t,bi)=>{
    const chord=CHORDS[bi%4];
    const phase=Math.floor(bi/8)%3; // change de section toutes les 8 mesures

    // ── Basse fondamentale (douce, triangle) ──
    note(chord.root/2,t,BEAT*0.9,"sine",0.18,0,0.06);
    note(chord.root/2,t+BEAT*2,BEAT*0.9,"sine",0.14,0,0.06);
    // petite ornement de basse
    if(bi%2===1)note(chord.root/2*1.125,t+BEAT*1.5,BEAT*0.4,"sine",0.1,0,0.04);

    // ── Pad harmonique (accords doux, pas de sawtooth agressif) ──
    chord.notes.forEach((f,i)=>{
      // voix 1 : sine pur, léger
      note(f,t+i*0.05,BAR*0.92,"sine",0.032,0,0.12);
      // voix 2 : triangle, légèrement désaccordé pour richesse
      note(f,t+i*0.05,BAR*0.90,"triangle",0.024,+5,0.14);
      // octave haute, très douce
      if(i<2)note(f*2,t+i*0.05,BAR*0.85,"sine",0.015,0,0.18);
    });

    // ── Percussions (plus légères) ──
    kick(t,0.45);
    hihat(t+BEAT*0.5);
    hihat(t+BEAT*0.75);
    snare(t+BEAT);
    hihat(t+BEAT*1.5);
    kick(t+BEAT*1.75,0.3);
    kick(t+BEAT*2,0.45);
    hihat(t+BEAT*2.5);
    hihat(t+BEAT*2.75);
    snare(t+BEAT*3);
    hihat(t+BEAT*3.5);

    // ── Mélodie principale (toutes les 2 mesures, flûte-like) ──
    if(bi%2===0){
      const mel=MELODIES[(Math.floor(bi/2)+phase)%MELODIES.length];
      let mt=t+BEAT*0.1; // légère anacrouse
      mel.forEach(([f,w])=>{
        note(f,mt,BEAT*w*0.85,"sine",0.11,0,0.04);
        // harmonique douce une tierce au-dessus
        note(f*1.189,mt+0.01,BEAT*w*0.75,"sine",0.03,0,0.06);
        mt+=w*BEAT;
      });
    }

    // ── Contre-chant (toutes les 4 mesures) ──
    if(bi%4===2){
      const cnt=COUNTER[Math.floor(bi/4)%COUNTER.length];
      let mt=t+BEAT*0.15;
      cnt.forEach(([f,w])=>{
        note(f,mt,BEAT*w*0.8,"triangle",0.055,0,0.08);
        mt+=w*BEAT;
      });
    }

    // ── Arpège de cordes (toutes les 8 mesures, section B) ──
    if(bi%8===4){
      chord.notes.forEach((f,i)=>{
        note(f,t+i*BEAT*0.5,BEAT*1.5,"sine",0.07,0,0.03);
      });
    }
  };

  const schedule=()=>{
    if(!playing)return;
    const t=ctx.currentTime+0.05;
    playBar(t,barIdx++);
    timeoutId=setTimeout(schedule,(BAR-0.07)*1000);
  };

  return{
    start(){
      init();
      if(ctx.state==="suspended")ctx.resume();
      if(playing)return;
      playing=true;barIdx=0;schedule();
    },
    stop(){
      playing=false;
      if(timeoutId)clearTimeout(timeoutId);
      if(master){master.gain.setTargetAtTime(0,ctx.currentTime,0.6);
        setTimeout(()=>{if(master)master.gain.value=vol;},1800);}
    },
    toggle(){if(playing)this.stop();else this.start();return playing;},
    setVol(v){vol=v;if(master)master.gain.setTargetAtTime(v,ctx.currentTime,0.15);},
    isPlaying(){return playing;}
  };
})();

const getRarityPool=(factions)=>{
  const pool=CARDS.filter(c=>factions.includes(c.faction)&&!c.isFusion&&!c.isChronoLegendaire&&!c.isSortEvolution&&c.type!=="trophee");
  const common=pool.filter(c=>c.type==="action"||(c.type==="personnage"&&(c.cost||0)<=3));
  const rare=pool.filter(c=>c.type==="equipement"||(c.type==="personnage"&&(c.cost||0)>=4&&(c.cost||0)<=6));
  const prestige=pool.filter(c=>c.type==="lieu"||(c.type==="personnage"&&(c.cost||0)>=7&&(c.cost||0)<=9));
  const ultragold=pool.filter(c=>c.type==="personnage"&&(c.cost||0)>=10);
  return{common,rare,prestige,ultragold};
};

const openPack=(packId)=>{
  const pack=SHOP_PACK_DEFS.find(p=>p.id===packId);
  if(!pack||pack.locked)return null;
  if(PLAYER_STATS.coins<pack.price){return{error:"Pas assez de pièces !"};} 
  const pools=getRarityPool(pack.factions);
  const pick=(arr)=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
  const cards=[];
  // 2 communes
  for(let i=0;i<2;i++){const c=pick(pools.common);if(c)cards.push({...c,rarity:"common"});}
  // 2 rares
  for(let i=0;i<2;i++){const c=pick(pools.rare);if(c)cards.push({...c,rarity:"rare"});}
  // 1 prestige
  const p=pick(pools.prestige);if(p)cards.push({...p,rarity:"prestige"});
  // 5% ultra gold
  if(Math.random()<0.05&&pools.ultragold.length){const u=pick(pools.ultragold);if(u)cards.push({...u,rarity:"ultragold"});}
  // Ajouter à la collection + marquer les nouvelles
  cards.forEach(c=>{
    c.isNew=(COLLECTION[c.id]||0)===0;
    COLLECTION[c.id]=(COLLECTION[c.id]||0)+1;
  });
  PLAYER_STATS.coins-=pack.price;
  saveStats();saveCollection();
  return{cards};
};
let PREVIEW_DECK_ID = null;
let MATCHUP = null;
let DIFFICULTY = "moyen";
let DECK_IDS = {player:null,ai:null};
let SELECTED_HAND = null;
let ATTACK_MODE = false;
let ATTACK_FROM = null;
let DETAIL_CARD = null;
let CHOICE = null;
let ANIM_BUSY = false;

// Helpers
const mkuid=()=>Math.random().toString(36).slice(2,10);
const shuffle=a=>[...a].sort(()=>Math.random()-0.5);
const $ =id=>document.getElementById(id);

// Draft: pick `count` cards from pool, max 2 copies of each card
const draftSlot=(pool,count)=>{
  const result=[];const copies={};
  const shuffled=shuffle([...pool]);
  // First pass: try to fill with max 2 copies each
  for(const c of shuffled){
    if(result.length>=count)break;
    if(!copies[c.id]){copies[c.id]=0;}
    if(copies[c.id]<2){result.push({...c,uid:mkuid()});copies[c.id]++;}
  }
  // Second pass: if not enough cards (small pool), allow more copies
  let safety=0;
  while(result.length<count&&safety<200){
    safety++;
    const c=shuffled[Math.floor(Math.random()*shuffled.length)];
    result.push({...c,uid:mkuid()});
  }
  return result;
};

// Cards excluded from faction draft pools until owned in collection
const LOCKED_FROM_POOL=new Set(["nalyaecume","bichecerynie","theonsacdor"]);

const buildDraftDeck=deckId=>{
  const dk=DECKS[deckId];
  const factions=dk.factions;
  // Calculer isCollBased d'abord
  const isCollBased=dk.collectionBased||!isDeckStarterUnlocked(deckId);
  // Use custom deck if defined AND non-vide
  const customDk=CUSTOM_DECKS[deckId];
  const customTotal=customDk?Object.values(customDk).reduce((a,v)=>a+(v?.length||0),0):0;
  if(customDk&&customTotal>0){
    const SLOT_MAX2={personnage:20,lieu:2,action:10,equipement:8};
    const deck=[];
    for(const[type,max] of Object.entries(SLOT_MAX2)){
      // 1. Cartes sélectionnées manuellement
      const selectedCards=(customDk[type]||[]).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
      // CL cards (in personnage slot only): included if selected
      const isCLfiltered=type!=="personnage";
      const take=Math.min(selectedCards.length,max);
      selectedCards.slice(0,take).forEach(c=>deck.push({
        ...c,uid:mkuid(),dmgTaken:0,bonusAtk:0,bonusHp:0,
        hasAttacked:false,justPlayed:false,_poisoned:false,
        _poisonParalysant:false,_repassuspec:false,_nikoProtectExpires:0
      }));
      // 2. Auto-complétion avec doublons et cartes Neutres
      const remaining=max-take;
      if(remaining>0){
        // Compter combien de fois chaque carte est déjà utilisée
        const usedCount={};
        selectedCards.slice(0,take).forEach(c=>{usedCount[c.id]=(usedCount[c.id]||0)+1;});
        // Pool élargi : faction du deck + Neutre + persoAllowed si deckperso
        const allFactions=[...factions,"Neutre"];
        // Cartes disponibles avec doublons
        const candidates=CARDS.filter(c=>
          c.type===type&&(allFactions.includes(c.faction)||(deckId==="deckperso"&&c.persoAllowed))&&
          !c.isFusion&&!c.isChronoLegendaire&&!c.isSortEvolution&&c.type!=="trophee"&&
          (COLLECTION[c.id]||0)>0
        );
        // Construire un pool avec copies selon collection
        const fillPool=[];
        candidates.forEach(c=>{
          const owned=COLLECTION[c.id]||0;
          const alreadyUsed=usedCount[c.id]||0;
          const extra=Math.max(0,owned-alreadyUsed);
          for(let i=0;i<extra;i++)fillPool.push(c);
        });
        deck.push(...draftSlot(fillPool,remaining));
      }
    }
    return shuffle(deck);
  }
  // Collection-based: non-starter decks play only with owned cards
  if(isCollBased){
    const deck=[];
    for(const[type,count] of Object.entries(dk.slots)){
      const pool=CARDS.filter(c=>c.type===type&&factions.includes(c.faction)&&!c.isFusion&&!c.isChronoLegendaire&&!c.isSortEvolution&&c.type!=="trophee"&&(COLLECTION[c.id]||0)>0);
      deck.push(...draftSlot(pool,count));
    }
    return shuffle(deck);
  }
  // Starter deck: toutes les cartes de la faction sont disponibles (hors CL, hors trophées)
  const deck=[];
  for(const[type,count] of Object.entries(dk.slots)){
    const pool=CARDS.filter(c=>c.type===type&&factions.includes(c.faction)&&!c.isFusion&&!c.isChronoLegendaire&&!c.isSortEvolution&&c.type!=="trophee"&&!LOCKED_FROM_POOL.has(c.id));
    deck.push(...draftSlot(pool,count));
  }
  return shuffle(deck);
};

const buildDraftDeckWithDiff=(deckId,diff)=>{
  const dk=DECKS[deckId];
  const factions=dk.factions;
  const deck=[];
  for(const[type,count] of Object.entries(dk.slots)){
    let pool=CARDS.filter(c=>c.type===type&&factions.includes(c.faction)&&!c.isFusion&&!c.isChronoLegendaire&&!LOCKED_FROM_POOL.has(c.id));
    if(diff==="facile"&&type==="personnage")pool=pool.filter(c=>!c.cost||c.cost<=6);
    if(diff==="difficile"&&type==="personnage"){
      const strong=pool.filter(c=>c.cost&&c.cost>=5);
      pool=[...pool,...strong,...strong,...strong];
    }
    deck.push(...draftSlot(pool,count));
  }
  return shuffle(deck);
};

const eqs=(eq2d,cuid)=>(eq2d||[]).flat().filter(e=>e&&e.attachedTo===cuid);

const calcAtk=(card,side,fx,lieu,isP)=>{

  let a=card.atk+(card.bonusAtk||0);
  const eq=eqs(side.equips,card.uid);

  if(lieu&&lieu.id==="champbataille"&&isP)a+=50;

    const vc=(side.field||[]).filter(c=>c&&c.faction==="Vikings").length;

    if(card.id==="brokk"&&(side.field||[]).find(c=>c&&c.id==="sven"))a+=150;
    if(card.id==="sven"&&(side.field||[]).find(c=>c&&c.id==="brokk"))a+=150;
    if(eq.find(e=>e.id==="arcfjord"))a+=200;
    if(eq.find(e=>e.id==="martonneroc"))a+=100;
    if(lieu&&lieu.id==="drakkarbrise"&&isP)a+=100;
    if(eq.find(e=>e.id==="casquejarl")){fx.filter(e=>e.target===card.uid&&e.type==="atk"&&e.bonus>0).forEach(e=>a+=e.bonus);return a;}
  }
  // ── Amazones ──
  if(card.faction==="Amazones"){
    if((side.field||[]).find(c=>c&&c.id==="vaelya"&&c.uid!==card.uid))a+=100;
    if(eq.find(e=>e.id==="lanceamazone"))a+=150;
    if(eq.find(e=>e.id==="arcamazone"))a+=100;
    if(eq.find(e=>e.id==="bottesamazones"))a+=100;
  }
  // ── Égyptiens ──
  if(card.faction==="Egyptiens"){
    if((side.field||[]).find(c=>c&&c.id==="pharaon"&&c.uid!==card.uid&&c._attackingThisCombat))a+=150;
    if(eq.find(e=>e.id==="khopeshdore"))a+=200;

const maxHp=(card,side,fx,lieu)=>{

  if(card.faction==="Vikings"){
    if(eq.find(e=>e.id==="pierrerunique"))b+=100;
    if(eq.find(e=>e.id==="martonneroc"))b+=100;
    if(eq.find(e=>e.id==="bouclienord"))b+=250;
    if((side.field||[]).find(c=>c&&c.id==="ragnar"&&c.uid!==card.uid))b+=100;

  }
  if(card.faction==="Egyptiens"){
    const sceptre=eq.find(e=>e.id==="sceptreanubis");if(sceptre)b+=card.cost<=3?300:100;
    if(eq.find(e=>e.id==="bouclierscara"))b+=200;
    if(eq.find(e=>e.id==="oeilhorus"))b+=100;
    // Neb-Khar Cavalier: +100 PV si au moins un Zombie sur le terrain (allié ou ennemi)
    if(card.id==="nebkharcavalier"){
      const zombiePresent=(G?.player?.field||[]).some(c=>c&&c.faction==="Zombies")||(G?.ai?.field||[]).some(c=>c&&c.faction==="Zombies");
      if(zombiePresent)b+=100;
    }
  }
  if(card.faction==="Amerindiens"){
    if((side.field||[]).find(c=>c&&c.id==="grandcheftotem"&&c.uid!==card.uid))b+=150;
    if(eq.find(e=>e.id==="coiffegrandesprit"))b+=150;
    if(eq.find(e=>e.id==="pendentifancetre"))b+=100;
    const brac=eq.find(e=>e.id==="bracelettotems");if(brac){b+=100;if(eq.length>1)b+=100;}
  }
  // ── Grecs Antiques ──
  if(card.faction==="Grecs"){
    if(eq.find(e=>e.id==="casquecorinthien"))b+=150;
    if(eq.find(e=>e.id==="armurebronze"))b+=250;
    // Lance d'Hoplite: +100 PV si 2+ Grecs
    const gc=(side.field||[]).filter(c=>c&&c.faction==="Grecs").length;
    if(eq.find(e=>e.id==="lancehoplite")&&gc>=2)b+=100;
    // Dionysos passif: si un autre Grec allié, un allié +100 PV (appliqué à l'entrée)
    // Parthénon: pendant le tour IA (géré dans resolveCombat/doEndTurn via fx)
  }
  // ── Ninjas ──
  if(card.faction==="Ninjas"){
    if(eq.find(e=>e.id==="technomask"))b+=100;
    if(eq.find(e=>e.id==="sabrebrume"))b+=100;
  }
  // ── Omega-Cuirasse passif ──
  if(card.id==="omegacuirasse"){const robotCount=(side.field||[]).filter(c=>c&&c.faction==="Robots"&&c.uid!==card.uid).length;b+=robotCount*100;}
  // ── Empoisonneurs équipements ──
  if(card.faction==="Empoisonneurs"){
    if(eq.find(e=>e.id==="daguevenin"))b+=0;// ATK only
    if(eq.find(e=>e.id==="technomasquepeste"))b+=100;
  }
  // ── Steampunk équipements PV ──
  if(card.faction==="Steampunk"){
    if(eq.find(e=>e.id==="lunettesing"))b+=100;
    if(eq.find(e=>e.id==="bottesriff"))b+=100;
    if(eq.find(e=>e.id==="dronelibellule"))b+=100;
    if(eq.find(e=>e.id==="montrerouages"))b+=100;
    if(eq.find(e=>e.id==="cleuniverselle"))b+=100;
  }
  // ── Punk équipements PV ──
  if(card.faction==="Punk"){
    if(eq.find(e=>e.id==="casquedubelierpunk"))b+=100;
    if(eq.find(e=>e.id==="cretedacier"))b+=150;

};

const killCard=(who,fi)=>{

  if(who==="player"&&!card._montreSaved){const eq=eqs(G.player.equips,card.uid);if(eq.find(e=>e&&e.id==="montrerouages")){G.player.field[fi]={...card,dmgTaken:0,_montreSaved:true};const mhp=maxHp(card,G.player,G.fx,G.lieu);G.player.field[fi].dmgTaken=Math.max(0,mhp-100);addLog("⏱️ Montre à Rouages: "+card.name+" survit avec 100 PV !");return;}}
  SFX.kill();

  if(who==="player"&&G.tayraTargets&&G.tayraTargets.length>0){G.tayraTargets.forEach(tuid=>{const ti=G.ai.field.findIndex(c=>c&&c.uid===tuid);if(ti!==-1&&G.ai.field[ti]){const t=G.ai.field[ti];const ch=curHp(t,G.ai,G.fx,G.lieu);if(100>=ch){killCard("ai",ti);stealPrestige("player","Tayra: "+t.name+" détruit !");}else{G.ai.field[ti]={...t,dmgTaken:(t.dmgTaken||0)+100};addLog("Tayra: "+t.name+" -100 PV");}}});}
  if(who==="ai"&&G.tayraTargets&&G.tayraTargets.length>0){G.tayraTargets.forEach(tuid=>{const ti=G.player.field.findIndex(c=>c&&c.uid===tuid);if(ti!==-1&&G.player.field[ti]){const t=G.player.field[ti];const ch=curHp(t,G.player,G.fx,G.lieu);if(100>=ch){killCard("player",ti);stealPrestige("ai","Tayra: "+t.name+" détruit !");}else{G.player.field[ti]={...t,dmgTaken:(t.dmgTaken||0)+100};addLog("Tayra: "+t.name+" -100 PV");}}});}
  // ── ROBOT SHIELD — Trio Robots: un autre Robot meurt à la place ──
  if(who==="player"&&card.faction==="Robots"&&G.robotShield){
    const sacrifice=G.player.field.find(c=>c&&c.faction==="Robots"&&c.uid!==card.uid);
    if(sacrifice){
      G.robotShield=false;
      const sacIdx=G.player.field.findIndex(c=>c&&c.uid===sacrifice.uid);
      addLog("🤖 Trio Robots: "+sacrifice.name+" se sacrifie à la place de "+card.name+" !");
      // Restore the original card (reset dmgTaken to survive with 1 PV)
      G.player.field[fi]={...card,dmgTaken:Math.max(0,(card.hp+(card.bonusHp||0))-1)};
      // Now kill the sacrifice
      const sCard=G.player.field[sacIdx];
      G.player.field[sacIdx]=null;G.player.equips[sacIdx]=[null,null];G.player.discard.push(sCard);
      return;
    }
  }
  if(who==="ai"&&card.faction==="Robots"&&G.robotShieldAi){
    const sacrifice=G.ai.field.find(c=>c&&c.faction==="Robots"&&c.uid!==card.uid);
    if(sacrifice){
      G.robotShieldAi=false;
      const sacIdx=G.ai.field.findIndex(c=>c&&c.uid===sacrifice.uid);
      G.ai.field[fi]={...card,dmgTaken:Math.max(0,(card.hp+(card.bonusHp||0))-1)};
      const sCard=G.ai.field[sacIdx];
      G.ai.field[sacIdx]=null;G.ai.equips[sacIdx]=[null,null];G.ai.discard.push(sCard);

      if(moana){moana.bonusAtk=(moana.bonusAtk||0)+50;addLog("Moana Carapace: +50 ATK ("+card.name+" détruite) !");}
    }
    // Scarabée Glacé: quand il est détruit au combat, l'attaquant perd -300 ATK
    if(who==="player"&&card.id==="scarabeeglace"&&G.lastCombatAttacker){
      G.fx.push({target:G.lastCombatAttacker,bonus:-300,type:"atk",endOfTurn:false});
      addLog("❄️ Scarabée Glacé: l'attaquant perd -300 ATK !");

    // Odrik Écaille Morte: retourne un DresseursDragons de coût ≤2 depuis la défausse vers la main
    if(card.id==="odrikecaillemorte"){
      const opts=G.player.discard.filter(c=>c.faction==="DresseursDragons"&&(c.cost||0)<=2);
      if(opts.length>0){
        const chosen=opts[opts.length-1];
        G.player.discard=G.player.discard.filter(c=>c.uid!==chosen.uid);
        G.player.hand.push({...chosen,uid:mkuid(),dmgTaken:0,bonusAtk:0,bonusHp:0,hasAttacked:false,justPlayed:false});
        addLog("Odrik: "+chosen.name+" retourne dans ta main !");
      }
    }
  }
  if(who==="player"&&G.ai.field[fi]===undefined){
    // Spider-Punk Pochtron: sur kill ennemi coût ≥4, pioche 1 (géré dans resolveCombat)
  }
  // ── ROBOTS HUMANOÏDES — effets à la destruction ──
  if(who==="player"){

    if(card.faction==="Robots"&&!card._coeurchybSaved){
      const eq=eqs(G.player.equips,card.uid);
      if(eq.find(e=>e&&e.id==="coeurchybernetique")){
        G.player.field[fi]={...card,dmgTaken:0,_coeurchybSaved:true};
        const mhp=maxHp(card,G.player,G.fx,G.lieu);
        G.player.field[fi].dmgTaken=Math.max(0,mhp-100);

    if(card.id==="grukfaussecarcasse"&&G.player.field.some(c=>c&&c.faction==="Robots"&&c.uid!==card.uid)){
      if(G.player.deck.length>0){G.player.hand.push(G.player.deck.shift());addLog("Gruk: détruit → pioche 1 carte !");}

    if(card.id==="err404"){

    if(card.faction==="Robots"){

      if(eq.find(e=>e&&e.id==="batterieame")){

    if(card.faction==="Robots"&&G.lieu&&G.lieu.id==="usineproduction"&&!G._usineUsed){

const stealPrestige=(who,msg)=>{

  G[who].prestige++;G[en].prestige--;
  if(who==="player")SFX.gainPrestige(); else SFX.losePrestige();
  addLog(msg);
  addLog("→ Vous: "+G.player.prestige+"/"+PW+" | IA: "+G.ai.prestige+"/"+PW);
  if(G[who].prestige>=PW||G[en].prestige<=0){G.phase="end";G.gameResult=who==="player"?"win":"lose";}
  if(who==="player"){
    showNotif("🏆 Vous +1 Prestige !\nVous: "+G.player.prestige+" | IA: "+G.ai.prestige,"#44cc88","🏆");
  } else {
    showNotif("💀 IA +1 Prestige !\nVous: "+G.player.prestige+" | IA: "+G.ai.prestige,"#ff6644","💀");
  }

const checkDeckOut=()=>{
  if(G.phase==="end")return;
  for(const who of["player","ai"]){
    const side=G[who];if(side.deck.length>0)continue;
    if(!side.hand.some(c=>c.type==="personnage")){
      const en=who==="player"?"ai":"player";
      G.phase="end";
      G.gameResult=side.prestige>G[en].prestige?(who==="player"?"win":"lose"):side.prestige<G[en].prestige?(who==="player"?"lose":"win"):"draw";
      addLog("Plus de cartes! Fin de partie.");
    }
  }
};

const hpColor=pct=>pct>0.6?"#44ee44":pct>0.3?"#ffaa00":"#ff3333";

const cardHTML=(card,size,opts={})=>{
  // Try /cards/{id}.png first, then imported IMGS, then emoji fallback
  const imgSrc=`cards/${card.id}.png`;
  const localImg=IMGS[card.id]||null;
  const isChar=card.type==="personnage";
  const {cHp,mHp,selected,glow,canAttack,hasAttacked,justPlayed,lastStand,showBadge}=opts;
  const pct=mHp?(cHp/mHp):1;
  const hpCol=hpColor(pct);
  const borderCol=selected?"#ffe066":glow?"#ff8844":TYPE_COLOR[card.type];
  const effAtk=opts.effAtk;
  const emojiBody=isChar?"⚔":"🔧";

  // Image block: /cards/ PNG → local import → emoji
  const statsOverlay=isChar?`<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.78);display:flex;justify-content:space-around;padding:3px 2px"><span style="font-size:9px;color:#ff9999;font-weight:bold">ATK ${effAtk!==undefined?effAtk:card.atk}</span><span style="font-size:9px;color:${hpCol};font-weight:bold">PV ${cHp!==undefined?cHp:card.hp}</span><span style="font-size:9px;color:#ffee88">★${card.cost}</span></div>`:"";
  const hpBarTop=isChar&&mHp&&cHp<mHp?`<div class="hp-bar-wrap" style="position:absolute;top:0;left:0;right:0;height:4px"><div class="hp-bar" style="width:${Math.max(0,pct*100)}%;background:${hpCol}"></div></div>`:"";

  // Build the image element with fallback chain
  const imgEl=`<img src="${imgSrc}" class="card-img" draggable="false" 
    onerror="${localImg
      ? `this.onerror=function(){this.style.display='none';this.nextElementSibling.style.display='flex';};this.src='${localImg}';`
      : `this.style.display='none';this.nextElementSibling.style.display='flex';`}"
    style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover">
    <div style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;align-items:center;justify-content:center">
      <div class="card-header" style="position:absolute;top:0;left:0;right:0;border-bottom:1px solid ${borderCol}44"><span style="font-size:6px;color:${FACTION_COLOR[card.faction]||'#aaa'}">◆</span><span class="card-name">${card.name}</span><span style="font-size:6px;color:${FACTION_COLOR[card.faction]||'#aaa'}">◆</span></div>
      <div style="font-size:${size==="zoom"?"60px":"26px"}">${emojiBody}</div>
      <div style="position:absolute;bottom:24px;left:0;right:0;padding:2px 3px"><div class="card-text">${card.effect||""}</div></div>
      ${isChar?`<div class="card-stats" style="position:absolute;bottom:0;left:0;right:0"><span class="stat-atk">ATK ${effAtk!==undefined?effAtk:card.atk}</span><span class="stat-hp" style="color:${hpCol}">PV ${cHp!==undefined?cHp:card.hp}</span><span class="stat-cost">★${card.cost}</span></div>`:""}
    </div>`;

  let inner=`<div style="position:relative;width:100%;height:100%">${imgEl}${hpBarTop}${statsOverlay}</div>`;

  let badges="";
  if(canAttack)badges+=`<div class="badge" style="background:${card.faction==='Vikings'?'#2255aa':'#22cc44'}">${card.faction==='Vikings'?'⚡':'✓'}</div>`;
  if(hasAttacked)badges+=`<div class="badge" style="background:#555">Z</div>`;
  if(justPlayed)badges+=`<div class="badge" style="background:#aa8800">N</div>`;
  if(lastStand)inner+=`<div class="last-stand">⚡Last Stand</div>`;
  // ── POISON indicator ──
  if(card._poisoned){
    inner+=`<div style="position:absolute;top:2px;right:2px;background:rgba(0,80,0,0.85);border:1px solid #55bb22;border-radius:4px;padding:1px 4px;font-size:9px;font-weight:bold;color:#88ff44;pointer-events:none;z-index:5">☠</div>`;
    // Green glow border override
    const poisonBorder="1px solid #55bb22";
    inner=`<div style="position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 8px #55bb2244;pointer-events:none;z-index:4"></div>`+inner;
  }

  const w=size==="hand"?82:size==="field"?95:size==="mini"?60:260;
  const h=size==="hand"?118:size==="field"?138:size==="mini"?87:376;
  return `<div class="card" style="width:${w}px;height:${h}px;border-color:${borderCol};background:#000;${selected?"transform:scale(1.07);box-shadow:0 0 14px #ffe066":glow?"box-shadow:0 0 10px #ff8844":""}">${inner}${badges}</div>`;
};

window.handleImgFile=(input,cardId)=>{
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{IMGS[cardId]=ev.target.result;saveImgs();renderImport();};
  r.readAsDataURL(f);input.value="";
};

window.exportImages=()=>{
  const count=Object.keys(IMGS).length;
  if(!count){alert("Aucune image à exporter !");return;}
  const data=JSON.stringify(IMGS);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="tcg-images.json";a.click();
  URL.revokeObjectURL(url);
};

window.importImages=(input)=>{
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      const count=Object.keys(data).length;
      Object.assign(IMGS,data);saveImgs();
      renderImport();
      setTimeout(()=>alert("✅ "+count+" images importées avec succès !"),100);
    }catch(e){alert("❌ Fichier invalide. Utilisez un fichier .json exporté depuis ce jeu.");}
  };
  r.readAsText(f);input.value="";
};

const getDeckUnlocked=(dk)=>{
  if(!dk.collectionBased)return true;
  const baseFaction=dk.lockFaction;
  const allBase=CARDS.filter(c=>c.faction===baseFaction&&!c.isFusion);
  const owned=allBase.filter(c=>(COLLECTION[c.id]||0)>0).length;
  const pct=allBase.length>0?owned/allBase.length:0;
  return pct>=0.85;
};

  if(!DECK_IDS.ai){alert("Choisissez un adversaire !");return;}

const renderChoiceModal=()=>{

  const ch=CHOICE;

window.goTo=screen=>{if(screen!=="game")MUSIC.stop();SCREEN=screen;render();};
window.replayGame=()=>{if(DECK_IDS.player){initGame(DECK_IDS.player,DECK_IDS.ai);SCREEN="game";renderGame();}else goToPlay();};

window.continuerChemin=()=>{
  if(!CHEMIN_STATE)return;
  const diffs=["facile","facile","moyen","moyen","difficile"];
  const nextDiff=diffs[Math.min(CHEMIN_STATE.step,4)];
  const deckKeys=Object.keys(DECKS).filter(k=>!DECKS[k].locked&&k!==DECK_IDS.player);
  const aiDeck=deckKeys[Math.floor(Math.random()*deckKeys.length)];
  MATCHUP={player:DECK_IDS.player,ai:aiDeck,difficulty:nextDiff};
  initGame(DECK_IDS.player,aiDeck);SCREEN="game";renderGame();
};
window.closeChoice=()=>{CHOICE=null;renderGame();};
window.closeDetail=()=>{DETAIL_CARD=null;renderGame();};

window.showDetail=(fi,side)=>{
  const c=G[side].field[fi];if(!c)return;
  DETAIL_CARD={...c,_side:side};renderGame();
};
window.showDetailCard=(cuid)=>{
  const c=G.player.hand.find(x=>x.uid===cuid);if(!c)return;
  DETAIL_CARD={...c,_side:"player",_fromHand:true};renderGame();
};

window.clickHand=idx=>{
  if(!G||G.phase!=="player"||CHOICE||ANIM_BUSY)return;
  const card=G.player.hand[idx];if(!card)return;
  if(ATTACK_MODE){ATTACK_MODE=false;ATTACK_FROM=null;SELECTED_HAND=null;renderGame();return;}
  SELECTED_HAND=SELECTED_HAND===idx?null:idx;
  renderGame();
};

window.clickPlayerField=fi=>{
  if(!G||G.phase!=="player"||CHOICE||ANIM_BUSY)return;
  if(SELECTED_HAND!==null){
    const card=G.player.hand[SELECTED_HAND];
    if(card){playCard(card.uid,fi);}
    return;
  }
  if(ATTACK_MODE)return;
  if(G.firstTurn){addLog("Impossible d'attaquer au 1er tour!");renderGame();return;}
  const c=G.player.field[fi];
  if(c&&c.id==="recrueapeur"&&!G.player.field.some((x,i)=>x&&i!==fi)){addLog("Recrue ne peut attaquer seule!");renderGame();return;}
  if(c&&!c.hasAttacked&&!c.justPlayed&&!G.firstTurn){ATTACK_MODE=true;ATTACK_FROM=fi;renderGame();}
};

window.clickAiField=fi=>{
  if(!G||!ATTACK_MODE||ATTACK_FROM===null||CHOICE||ANIM_BUSY)return;
  const tgt=G.ai.field[fi];if(!tgt)return;
  doPlayerAttack(ATTACK_FROM,"field",fi);
  ATTACK_MODE=false;ATTACK_FROM=null;SELECTED_HAND=null;
};

window.attackPrestige=()=>{
  if(!G||!ATTACK_MODE||ATTACK_FROM===null)return;
  doPlayerAttack(ATTACK_FROM,"prestige",-1);
  ATTACK_MODE=false;ATTACK_FROM=null;SELECTED_HAND=null;
};

// ═══════════════════════════════════════════════════════
// COMBAT
// ═══════════════════════════════════════════════════════
const resolveCombat=(who,afi,ttype,tfi)=>{
  const isP=who==="player";const en=isP?"ai":"player";
  const atk=G[who].field[afi];if(!atk)return;
  // Carapax-9: redirige les dégâts vers lui-même AVANT tout calcul
  if(ttype==="field"&&who==="ai"){
    const def=G[en].field[tfi];
    if(def&&def.faction==="Robots"&&def.id!=="carapax9"){
      const carapaxIdx=G.player.field.findIndex(c=>c&&c.id==="carapax9");
      if(carapaxIdx!==-1&&carapaxIdx!==tfi){
        addLog("🛡️ Carapax-9 intercepte l'attaque sur "+def.name+" !");
        resolveCombat(who,afi,ttype,carapaxIdx);
        return;
      }
    }
  }
  if(isP)SFX.attack();
  let a=calcAtk(atk,G[who],G.fx,G.lieu,isP);
  if(ttype==="field"){
    const def=G[en].field[tfi];
    if(atk.id==="fenrir"&&def&&def.dmgTaken>0)a+=150;
    if(atk.id==="erikhache")a+=50;
    // Guerrier des Plaines: quand il attaque, un Amérindien allié +100 ATK ce combat
    if(atk.id==="guerrierplaines"){
      const al=G[who].field.filter(c=>c&&c.faction==="Amerindiens"&&c.uid!==atk.uid);
      if(al.length>0){G.fx.push({target:al[0].uid,bonus:100,type:"atk",endOfTurn:true});addLog(al[0].name+" +100 ATK (Guerrier des Plaines)!");}
    }
    // Lame d'Athènes: +100 ATK quand elle attaque
    if(atk.id==="lameath")a+=100;
    // Champion de Sparte: +200 ATK si cible a plus de PV
    if(atk.id==="championsparte"&&def){const atkHp=curHp(atk,G[who],G.fx,G.lieu);const defHp=curHp(def,G[en],G.fx,G.lieu);if(defHp>atkHp)a+=200;}
    // Samouraï Hellénique: +100 ATK par équipement attaché
    if(atk.id==="samohellenique"){const eq2=eqs(G[who].equips,atk.uid);a+=eq2.length*100;}
    // Knut: +150 ATK si un autre Viking allié est présent
    if(atk.id==="knut"&&(G[who].field||[]).find(c=>c&&c.uid!==atk.uid&&c.faction==="Vikings"))a+=150;
    // Sobek: +200 ATK si cible a moins de PV que lui
    if(atk.id==="sobek"&&def){const atkHp=curHp(atk,G[who],G.fx,G.lieu);const defHp=curHp(def,G[en],G.fx,G.lieu);if(defHp<atkHp)a+=200;}
    // Armure Solaire: quand attaque, un Egyptien allié +200 ATK ce combat (marqué temporairement)
    if(atk.id==="armuregypte"){const al=G[who].field.filter(c=>c&&c.faction==="Egyptiens"&&c.uid!==atk.uid);if(al.length>0){G.fx.push({target:al[0].uid,bonus:200,type:"atk",endOfTurn:true});}}
    // Pharaon: marque _attackingThisCombat pour calcAtk passif
    if(atk.id==="pharaon"){const nf=[...G[who].field];const pi=nf.findIndex(c=>c&&c.uid===atk.uid);if(pi!==-1){nf[pi]={...nf[pi],_attackingThisCombat:true};G[who].field=nf;}}
    if(def&&def.dmgTaken>0){const eq=eqs(G[who].equips,atk.uid);if(eq.find(e=>e.id==="daguecroc")&&atk.faction==="Vikings")a+=150;}
    // Griffes de Bastet: +100 ATK si cible a moins de PV
    if(atk.faction==="Egyptiens"&&def){const eq2=eqs(G[who].equips,atk.uid);if(eq2.find(e=>e.id==="griffesbastet")&&curHp(def,G[en],G.fx,G.lieu)<curHp(atk,G[who],G.fx,G.lieu))a+=100;}
    // ── Ninja equipment combat bonuses ──
    if(atk.faction==="Ninjas"&&def){
      const eq2=eqs(G[who].equips,atk.uid);
      // Lame des Ténèbres: +100 si cible déjà blessée
      if(eq2.find(e=>e.id==="lametenebres")&&(def.dmgTaken||0)>0){a+=100;}
      // Marque Mortelle: +100 si cible est marquée
      if(G.marqueTarget&&G.marqueTarget===def.uid){a+=100;}
    }
    // Bombes Fumigènes: quand ce Ninja SUBIT une attaque, -200 à l'ATK entrante (1x/tour)
    if(def&&def.faction==="Ninjas"&&ttype==="field"){
      const eq2=eqs(G[en].equips,def.uid);
      if(eq2.find(e=>e.id==="bombesfumig")&&!G.fumigUsedTurn){
        a=Math.max(0,a-200);G.fumigUsedTurn=true;addLog("Bombes Fumigènes: -200 dégâts !");
      }
    }
    // Piège Shinobi: si l'attaquant a un piège, subit 200 dégâts avant
    if(atk._piegeShinobi&&ttype==="field"){
      const ch2=curHp(atk,G[who],G.fx,G.lieu);
      if(200>=ch2){killCard(who,afi);addLog("Piège Shinobi: "+atk.name+" détruit!");return;}
      else{G[who].field[afi]={...G[who].field[afi],dmgTaken:(G[who].field[afi].dmgTaken||0)+200,_piegeShinobi:false};addLog("Piège Shinobi: "+atk.name+" -200 PV !");}
    }
    // Clones de Brume: si la cible a le shield, annule l'attaque
    if(def&&def._clonesShield&&ttype==="field"){
      G[en].field[tfi]={...def,_clonesShield:false};
      addLog("Clones de Brume: l'attaque contre "+def.name+" est annulée !");
      G[who].field[afi]={...G[who].field[afi],hasAttacked:true};renderGame();return;
    }
    // Sabre de Brume: première attaque ennemie annulée
    if(def&&def._sabreFirst&&ttype==="field"&&!isP){
      G[en].field[tfi]={...def,_sabreFirst:false};
      addLog("Sabre de Brume: attaque de "+atk.name+" annulée !");
      G[who].field[afi]={...G[who].field[afi],hasAttacked:true};renderGame();return;
    }
    // Canyon des Esprits Rouges: 1x/tour premier Amerindien qui attaque +100 ATK, marquer utilisé
    if(atk.faction==="Amerindiens"&&isP&&G.lieu&&G.lieu.id==="canyonesprits"&&!G.lieu.canyonUsed){a+=100;G.lieu.canyonUsed=true;}
    // Arc du Faucon: 100 dégâts à un ennemi <=300 PV avant le combat
    if(atk.faction==="Amerindiens"&&ttype==="field"){const eq2=eqs(G[who].equips,atk.uid);if(eq2.find(e=>e.id==="arcfaucon")){const oi=G[en].field.findIndex((c,i)=>c&&i!==tfi&&curHp(c,G[en],G.fx,G.lieu)<=300);if(oi!==-1){const o=G[en].field[oi];const oh=curHp(o,G[en],G.fx,G.lieu)-100;if(oh<=0){killCard(en,oi);stealPrestige(who,"Arc Faucon: détruit "+o.name+"!");}else{G[en].field[oi]={...o,dmgTaken:(o.dmgTaken||0)+100};addLog("Arc Faucon: 100 dégâts à "+o.name);}}}}
    // Sumo du Bison Sacré: quand il est attaqué (= quand il défend), +200 ATK (pour le prochain tour)
    // Pour le Sumo, le bonus s'applique quand il PREND des dégâts → géré dans la section "damages without kill"
    // Jungle Luxuriante: quand un ennemi attaque, -100 ATK
    if(ttype==="field"&&G.lieu&&G.lieu.id==="junglelux"&&who==="ai"){
      a=Math.max(0,a-100);addLog("Jungle: ennemi -100 ATK !");
    }
    // Nayra: quand attaquée, attaquant -100 ATK 1x/tour
    if(def&&def.id==="nayra"&&!def.nayraUsed){
      a=Math.max(0,a-100);
      G[en].field[tfi]={...G[en].field[tfi],nayraUsed:true};
      addLog("Nayra: attaquant -100 ATK !");
    }
  }
  // Marquer l'attaquant comme ayant attaqué — utiliser l'état courant, pas le snapshot
  if(G[who].field[afi])G[who].field[afi]={...G[who].field[afi],hasAttacked:true};
  if(atk.id==="moustique")G[who].field[afi].bonusHp=(G[who].field[afi].bonusHp||0)+100;
  // Naya / Brakka: quand elles attaquent, une Amazone alliée gagne ATK
  if(ttype==="field"&&(atk.id==="naya"||atk.id==="brakka")){
    const bonus=atk.id==="brakka"?150:100;
    const al=G[who].field.filter(c=>c&&c.faction==="Amazones"&&c.uid!==atk.uid);
    if(al.length>0){G.fx.push({target:al[0].uid,bonus,type:"atk",endOfTurn:true});addLog(al[0].name+" +"+(bonus)+" ATK ("+atk.name+")!");}
  }
  // Shana: quand elle attaque, tous les ennemis -100 ATK ce tour
  if(atk.id==="shana"&&ttype==="field"){
    G[en].field.forEach(c=>{if(c)G.fx.push({target:c.uid,bonus:-100,type:"atk",endOfTurn:true});});
    addLog("Shana: tous les ennemis -100 ATK !");
  }

  if(ttype==="prestige"){
    // Elyna: quand elle attaque le prestige, une Amazone alliée +100 ATK
    if(atk.id==="elyna"){
      const al=G[who].field.filter(c=>c&&c.faction==="Amazones"&&c.uid!==atk.uid);
      if(al.length>0){G.fx.push({target:al[0].uid,bonus:100,type:"atk",endOfTurn:true});addLog(al[0].name+" +100 ATK (Elyna)!");}
    }
    // Bottes Amazones: pioche 1 quand attaque le prestige
    if(isP&&atk.faction==="Amazones"){const eq=eqs(G.player.equips,atk.uid);if(eq.find(e=>e.id==="bottesamazones")){drawCard("player");addLog("Bottes Amazones: pioche 1 !");}}
    stealPrestige(who,atk.name+" attaque !");
  } else {
    const def=G[en].field[tfi];if(!def)return;
    const ch=curHp(def,G[en],G.fx,G.lieu);
    addLog(atk.name+"("+a+") vs "+def.name+"("+ch+")");
    if(a>=ch){
      // Amazonia shield: si Amazonia est sur le terrain allié et a des PV, empêche la destruction
      if(en==="player"&&G.phase!=="end"){
