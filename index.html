    else if(id==="surchargechaudiere"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"surchargechaudiere",options:opts};renderGame();},100);return;}else addLog("Surcharge: aucun ennemi.");}
    else if(id==="jetvapeurbrulante"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"jetvapeurbrulante",options:opts};renderGame();},100);return;}else addLog("Jet de Vapeur: aucun ennemi.");}
    else if(id==="sabotagemeca"){const aiEqs=[];G.ai.equips.forEach((slot,fi)=>slot.forEach((eq,ei)=>{if(eq)aiEqs.push({eq,fi,ei});}));if(aiEqs.length){const pick=aiEqs[0];G.ai.equips[pick.fi][pick.ei]=null;G.ai.discard=[...(G.ai.discard||[]),pick.eq];addLog("⚙️ Sabotage: "+pick.eq.name+" détruit !");}else{const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"sabotage_dmg",options:opts};renderGame();},100);return;}else addLog("Sabotage: aucune cible.");}}
    else if(id==="blindageurgence"){const opts=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.faction==="Steampunk");if(opts.length){setTimeout(()=>{CHOICE={type:"blindageurgence",options:opts};renderGame();},100);return;}else addLog("Blindage: aucun Steampunk allié.");}
    else if(id==="recrutementindus"){drawCard("player");const hasEq=G.player.field.some((c,j)=>c&&c.faction==="Steampunk"&&eqs(G.player.equips,c.uid).find(e=>e));if(hasEq){drawCard("player");addLog("⚙️ Recrutement Industriel: 2 cartes piochées !");}else addLog("⚙️ Recrutement: 1 carte piochée.");}
    else if(id==="greveouvriers"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"greveouvriers",options:opts};renderGame();},100);return;}else addLog("Grève: aucun ennemi.");}
    // ── Actions Empoisonneurs ──
    else if(id==="brulureacide"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"brulureacide",options:opts};renderGame();},100);return;}else addLog("Brûlure: aucune cible.");}
    else if(id==="injectiontoxique"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"poison_single",options:opts,dmg:100,turns:3,label:"Injection Toxique"};renderGame();},100);return;}else addLog("Injection: aucune cible.");}
    else if(id==="fuitegaz"){[...G.ai.field].forEach((c,i)=>{if(!c)return;G.ai.field[i]=null;G.ai.equips[i]=[null,null];G.ai.hand.push({...c,uid:mkuid()});});addLog("💨 Fuite Gaz Vert: tous les ennemis renvoyés en main !");}
    else if(id==="poisonparalysant"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(opts.length){setTimeout(()=>{CHOICE={type:"poisonparalysant",options:opts};renderGame();},100);return;}else addLog("Poison Paralysant: aucun ennemi empoisonné.");}
    else if(id==="sporestouffe"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"sporestouffe",options:opts};renderGame();},100);return;}else addLog("Spores: aucune cible.");}
    else if(id==="rechercheantidote"){const allys=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(allys.length){G.dotEffects=G.dotEffects.filter(d=>d.uid!==allys[0].c.uid);allys[0].c._poisoned=false;addLog("🧪 Antidote: "+allys[0].c.name+" guéri !");}else addLog("Antidote: aucun allié empoisonné.");drawCard("player");drawCard("player");addLog("Antidote: +2 cartes piochées");}
    else if(id==="recetteinterdite"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(opts.length){setTimeout(()=>{CHOICE={type:"recetteinterdite",options:opts};renderGame();},100);return;}else addLog("Recette: aucun ennemi empoisonné.");}
    else if(id==="marchenoir"){const pool=G.player.deck.filter(c=>c.faction==="Empoisonneurs"||c.id==="brulureacide"||c.id==="injectiontoxique"||c.id==="fuitegaz"||c.id==="poisonparalysant"||c.id==="sporestouffe"||c.id==="rechercheantidote"||c.id==="recetteinterdite"||c.id==="marchenoir"||c.id==="decomposition"||c.id==="repassuspec"||c.id==="daguevenin"||c.id==="sarbacane"||c.id==="cannelame"||c.id==="technomasquepeste"||c.id==="fioletox"||c.id==="aiguillecontam"||c.id==="bombegaz");if(pool.length){const top=pool.map((c,i)=>({c,i:G.player.deck.findIndex(x=>x.uid===c.uid)}));setTimeout(()=>{CHOICE={type:"marchenoir",options:top.slice(0,5)};renderGame();},100);return;}else addLog("Marché Noir: deck vide / aucune carte Empoisonneur.");}
    else if(id==="decomposition"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(opts.length){setTimeout(()=>{CHOICE={type:"decomposition",options:opts};renderGame();},100);return;}else addLog("Décomposition: aucun ennemi empoisonné.");}
    else if(id==="repassuspec"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"repassuspec",options:opts};renderGame();},100);return;}else addLog("Repas Suspect: aucune cible.");}
    addLog(card.name+" jouée.");

  } else if(card.type==="lieu"){
    G.player.hand.splice(ci,1);
    if(G.lieu)addLog(G.lieu.name+" remplacé!");
    G.lieu={...card,uid:mkuid()};addLog("Lieu: "+card.name);
  }
  renderGame();
};

// ── HANDLE CHOICE ──
window.doChoice=(action,payload)=>{
  const ch=CHOICE;CHOICE=null;
  if(ch.type==="clankbeak"){if(action==="bottom"&&G.player.deck.length>0){const[t,...r]=G.player.deck;G.player.deck=[...r,t];}}
  else if(ch.type==="ile"){if(action==="draw"){drawCard("player");addLog("Pioche 1!");}else if(action==="steal"){const st=G.ai.hand.splice(payload,1)[0];G.player.hand.push({...st,uid:mkuid()});addLog("Vous volez "+st.name+"!");}}
  else if(ch.type==="explosion"){if(action==="lieu"){addLog(G.lieu.name+" détruit!");G.lieu=null;}else if(action==="equip"){const{fi,ei}=payload;const eq=G.ai.equips[fi][ei];G.ai.equips[fi][ei]=null;addLog(eq.name+" détruit!");}}
  else if(ch.type==="volpuissance_my"){CHOICE={...ch,type:"volpuissance_en",myPick:payload};renderGame();return;}
  else if(ch.type==="volpuissance_en"){const myC=G.player.field[ch.myPick];const enC=G.ai.field[payload];if(myC&&enC){G.fx.push({target:myC.uid,bonus:200,type:"atk",endOfTurn:true},{target:enC.uid,bonus:-200,type:"atk",endOfTurn:true});addLog("Vol: "+myC.name+" +200, "+enC.name+" -200 ATK!");}}
  else if(ch.type==="eirik"&&action==="top"){if(G.player.deck.length>=2){const[a,b,...r]=G.player.deck;G.player.deck=payload===0?[a,...r,b]:[b,...r,a];addLog("Eirik réorganise le deck.");}}
  else if(ch.type==="olympe_choice"){if(action==="draw"){drawCard("player");addLog("L'Olympe: pioche 1!");}else{const al=G.player.field.find(x=>x&&x.faction==="Grecs");if(al){G.fx.push({target:al.uid,bonus:100,type:"atk",endOfTurn:true});addLog("L'Olympe: "+al.name+" +100 ATK!");}}}
  else if(ch.type==="trio_grecs"){const c=G.ai.field[payload];if(c){G.frozenChars.push(c.uid);addLog("🏛️ TRIO GRECS ! "+c.name+" ne peut pas attaquer au prochain tour !");}}  else if(ch.type==="duelheros_my"){CHOICE={...ch,type:"duelheros_en",myPick:payload};renderGame();return;}
  else if(action==="pick"){
    const i=payload;
    if(ch.type==="sauvetage"||ch.type==="retourinattendu"||ch.type==="retourvalhalla"){
      const arr=ch.type==="retourvalhalla"?G.player.discard.filter(c=>c.faction==="Vikings"):G.player.discard.filter(c=>c.type==="personnage"&&(ch.type==="sauvetage"?c.faction==="Pirates":true));
      const c=arr[i];if(!c){}else{G.player.discard=G.player.discard.filter(x=>x.uid!==c.uid);G.player.hand.push({...c,uid:mkuid()});addLog(c.name+" en main!");}
    } else if(ch.type==="hurgan"){const t=G.ai.field[i];if(t){G.ai.field[i]=null;G.ai.equips[i]=[null,null];G.ai.hand.push({...t,uid:mkuid()});addLog(t.name+" renvoyé!");}
    } else if(ch.type==="corliss"){const nh=G.ai.hand.splice(i,1)[0];if(nh){G.player.hand.push({...nh,uid:mkuid()});addLog("Corliss vole "+nh.name+"!");}
    } else if(ch.type==="malgor"){const eq=G.player.deck[i];if(eq){G.player.deck.splice(i,1);G.player.hand.push(eq);addLog(eq.name+" récupéré!");}
    } else if(ch.type==="silence"){if(G.ai.field[i]){G.ai.field[i]={...G.ai.field[i],silenced:true};addLog(G.ai.field[i].name+" silencé!");}
    } else if(ch.type==="lyra"){addLog("Lyra contrôle "+G.ai.field[i]?.name+".");
    } else if(ch.type==="iskra"||ch.type==="abordage"||ch.type==="frappenforcee"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:200,type:"atk",endOfTurn:true});addLog(c.name+" +200 ATK!");}
    } else if(ch.type==="nettoyage"){const c=G.player.field[i];if(c)G.fx=G.fx.filter(e=>!(e.target===c.uid&&e.bonus<0));
    } else if(ch.type==="surcroit"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:200,type:"hp",endOfTurn:false});addLog(c.name+" +200 PV!");}
    } else if(ch.type==="planche"){const t=G.ai.field[i];if(t){killCard("ai",i);stealPrestige("player","La Planche détruit "+t.name+"!");}
    } else if(ch.type==="impactcible"){const def=G.ai.field[i];if(def){const cH=curHp(def,G.ai,G.fx,G.lieu);if(200>=cH){killCard("ai",i);stealPrestige("player","Impact détruit "+def.name+"!");}else{G.ai.field[i]={...def,dmgTaken:(def.dmgTaken||0)+200};addLog("Impact: "+def.name+" -> PV:"+(cH-200));}}
    } else if(ch.type==="haldor"||ch.type==="ylvabaies"){const c=G.player.field[i];if(c){c.bonusHp=(c.bonusHp||0)+100;addLog(c.name+" +100 PV!");}
    } else if(ch.type==="petittorvald"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:100,type:"atk",endOfTurn:true});addLog(c.name+" +100 ATK!");}
    } else if(ch.type==="freyja"||ch.type==="entravesygg"||ch.type==="kaya"){const c=G.ai.field[i];if(c){G.fx.push({target:c.uid,bonus:-200,type:"atk",endOfTurn:true});addLog(c.name+" -200 ATK!");if(ch.type==="kaya"&&ch.hasOtherViking&&ch.kayaUid){const kay=G.player.field.find(x=>x&&x.uid===ch.kayaUid);if(kay)G.fx.push({target:ch.kayaUid,bonus:200,type:"atk",endOfTurn:true});addLog("Kaya +200 ATK!");}}
    } else if(ch.type==="astrid"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:200,type:"atk",endOfTurn:true});addLog(c.name+" +200 ATK!");}
    } else if(ch.type==="benediction"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:200,type:"atk",endOfTurn:true},{target:c.uid,bonus:200,type:"hp",endOfTurn:true});addLog(c.name+" +200 ATK +200 PV!");}
    } else if(ch.type==="fureur"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:400,type:"atk",endOfTurn:true});G.fureurTarget=c.uid;addLog(c.name+" +400 ATK ! (-200 PV fin tour)");}
    } else if(ch.type==="rempartrunes"){const c=G.player.field[i];if(c){c.bonusHp=(c.bonusHp||0)+300;addLog(c.name+" +300 PV!");}
    } else if(ch.type==="chope"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:200,type:"atk",endOfTurn:true});const mH=maxHp(c,G.player,G.fx,G.lieu);const nd=(c.dmgTaken||0)+200;if(nd>=mH){killCard("player",i);addLog(c.name+" détruit par la Chope!");}else{c.dmgTaken=nd;addLog(c.name+" +200 ATK / -200 PV!");}}
    } else if(ch.type==="prisongivre"){const c=G.ai.field[i];if(c){G.frozenChars.push(c.uid);addLog("Prison: "+c.name+" gelé!");}}
    else if(ch.type==="lya"){const c=G.player.field[i];if(c){G.fx.push({target:c.uid,bonus:100,type:"hp",endOfTurn:true});addLog(c.name+" +100 PV (Lya)!");}}
    else if(ch.type==="shaya"){const c=G.player.field[i];if(c){c.bonusHp=(c.bonusHp||0)+200;addLog(c.name+" +200 PV (Shaya)!");}}
    else if(ch.type==="selka"){const c=G.ai.field[i];if(c){G.fx.push({target:c.uid,bonus:-200,type:"atk",endOfTurn:true});addLog("Selka: "+c.name+" -200 ATK!");}}
    else if(ch.type==="espritetbete"){const c=G.player.field[i];if(c){c.bonusHp=(c.bonusHp||0)+200;G.fx.push({target:c.uid,bonus:200,type:"atk",endOfTurn:true});addLog(c.name+" +200 ATK +200 PV (Esprit)!");}}
    else if(ch.type==="fosseauxpiques"){const t=G.ai.field[i];if(t){killCard("ai",i);stealPrestige("player","Fosse détruit "+t.name+"!");if(ch.hasAmazone){drawCard("player");addLog("Fosse: pioche 1 !");}}}
    else if(ch.type==="totemancien"){const arr=G.player.discard.filter(c=>c.faction==="Amazones");const c=arr[i];if(c){G.player.discard=G.player.discard.filter(x=>x.uid!==c.uid);G.player.hand.push({...c,uid:mkuid()});addLog(c.name+" revient du Totem!");}}
    else if(ch.type==="voilebrume"){const c=G.player.field[i];if(c){c.hasAttacked=false;c.canDoubleAttack=true;addLog(c.name+" peut attaquer 2 fois (Voile)!");}}
    else if(ch.type==="marquetribale"){const c=G.ai.field[i];if(c){const atk0=calcAtk(c,G.ai,G.fx,G.lieu,false);G.fx.push({target:c.uid,bonus:-atk0-9999,type:"atk",turnsLeft:3});addLog("Marque Tribale: "+c.name+" perd toute son ATK 3 tours!");}}

    else if(ch.type==="prisonracines"){const c=G.ai.field[i];if(c){G.frozenChars.push(c.uid);const ch2=curHp(c,G.ai,G.fx,G.lieu);if(ch2<=300){killCard("ai",i);stealPrestige("player","Prison de Racines détruit "+c.name+"!");}else addLog("Prison de Racines: "+c.name+" gelé 1 tour!");}}
    // ── Égyptiens choices ──
    else if(ch.type==="passeurnil"){const c=G.player.field[i];if(c){const mh=maxHp(c,G.player,G.fx,G.lieu);c.dmgTaken=Math.max(0,(c.dmgTaken||0)-200);addLog("Passeur: "+c.name+" +200 PV!");}}
    else if(ch.type==="gardiennil"){const c=G.ai.field[i];if(c){G.fx.push({target:c.uid,bonus:-300,type:"atk",endOfTurn:true});addLog("Gardien: "+c.name+" -300 ATK!");}}
    else if(ch.type==="isis"){const arr=G.player.discard.filter(c=>c.faction==="Egyptiens");const c=arr[i];if(c){G.player.discard=G.player.discard.filter(x=>x.uid!==c.uid);G.player.hand.push({...c,uid:mkuid()});addLog("Isis: "+c.name+" en main!");}}
    else if(ch.type==="pretressenil"){const c=G.player.field[i];if(c){c.dmgTaken=Math.max(0,(c.dmgTaken||0)-400);addLog("Prêtresse: "+c.name+" +400 PV!");}}
    else if(ch.type==="cowboy"){const def=G.ai.field[i];if(def){const ch2=curHp(def,G.ai,G.fx,G.lieu);if(300>=ch2){killCard("ai",i);stealPrestige("player","Cowboy détruit "+def.name+"!");}else{G.ai.field[i]={...def,dmgTaken:(def.dmgTaken||0)+300};addLog("Cowboy: "+def.name+" -300 PV!");}}}
    // ── Égyptiens action choices ──
    else if(ch.type==="reveilpharaon"){const arr=G.player.discard.filter(c=>c.faction==="Egyptiens");const c=arr[i];if(c){G.player.discard=G.player.discard.filter(x=>x.uid!==c.uid);G.player.hand.push({...c,uid:mkuid()});addLog("Réveil: "+c.name+" en main!");}}

    else if(ch.type==="enfantrongeurs"){const c=G.ai.field[i];if(c){G.fx.push({target:c.uid,bonus:-100,type:"atk",endOfTurn:true});addLog("Enfant: "+c.name+" -100 ATK!");}}

    }
    else if(ch.type==="tayra_target"){
      const t=G.ai.field[payload];if(t){if(!G.tayraTargets)G.tayraTargets=[];G.tayraTargets.push(t.uid);t._poisoned=true;addLog("Tayra: "+t.name+" ciblé(e) (-100 PV par mort alliée) !");}
    }
    else if(ch.type==="klausbrume"){
      const t=G.ai.field[payload];if(t){G.fx.push({target:t.uid,bonus:-100,type:"atk",endOfTurn:true});addLog("Klaus: "+t.name+" -100 ATK !");if(ch.hasLieu){const ch2=curHp(t,G.ai,G.fx,G.lieu);if(100>=ch2){killCard("ai",payload);stealPrestige("player","Klaus détruit "+t.name+"!");}else{G.ai.field[payload]={...G.ai.field[payload],dmgTaken:(G.ai.field[payload].dmgTaken||0)+100};addLog("Klaus (lieu): "+t.name+" -100 PV !");}}}
    }
    else if(ch.type==="dragon_venin"||ch.type==="sylvara"){
      if(action==="toggle"){const sel=ch.selected||[];const idx=sel.indexOf(payload);if(idx!==-1)ch.selected=sel.filter(x=>x!==payload);else if(sel.length<2)ch.selected=[...sel,payload];CHOICE=ch;renderGame();return;}
      else if(action==="confirm"){const dmg=ch.type==="dragon_venin"?150:100;const turns=ch.type==="dragon_venin"?-1:3;(ch.selected||[]).forEach(i=>{const t=G.ai.field[i];if(t){poisonChar("ai",t.uid,dmg,turns);addLog("☠ "+(ch.type==="dragon_venin"?"Dragon":"Sylvara")+": "+t.name+" empoisonné(e) !");}});}
    }
    else if(ch.type==="brulureacide"){const t=G.ai.field[payload];if(t){const ch2=curHp(t,G.ai,G.fx,G.lieu);const dmg=200;if(dmg>=ch2){killCard("ai",payload);stealPrestige("player","Brûlure Acide détruit "+t.name+"!");}else{G.ai.field[payload]={...t,dmgTaken:(t.dmgTaken||0)+dmg};G.fx.push({target:t.uid,bonus:-50,type:"atk",endOfTurn:true});addLog("🔥 Brûlure Acide: "+t.name+" -200 PV -50 ATK!");}}}
    else if(ch.type==="poisonparalysant"){const t=G.ai.field[payload];if(t){G.ai.field[payload]={...t,_poisonParalysant:true};addLog("☠ Poison Paralysant: "+t.name+" ne peut plus attaquer tant qu'empoisonné !");};}
    else if(ch.type==="sporestouffe"){const t=G.ai.field[payload];if(t){poisonChar("ai",t.uid,100,3,t._poisoned?50:0);addLog("🍄 Spores: "+t.name+" -100 PV/tour pendant 3 tours"+(t._poisoned?" -50 ATK":"")+"!");}}
    else if(ch.type==="recetteinterdite"){const t=G.ai.field[payload];if(t){G.dotEffects.forEach(d=>{if(d.uid===t.uid)d.dmgHp*=2;});addLog("📜 Recette Interdite: poison de "+t.name+" doublé!");}}
    else if(ch.type==="decomposition"){const t=G.ai.field[payload];if(t){const dots=G.dotEffects.filter(d=>d.uid===t.uid&&d.dmgHp>0);const totalDmg=dots.reduce((s,d)=>s+(d.turnsLeft===-1?d.dmgHp*3:d.dmgHp*Math.max(1,d.turnsLeft)),0);G.dotEffects=G.dotEffects.filter(d=>d.uid!==t.uid);const ch2=curHp(t,G.ai,G.fx,G.lieu);if(totalDmg>=ch2){killCard("ai",payload);stealPrestige("player","Décomposition détruit "+t.name+"!");}else{G.ai.field[payload]={...G.ai.field[payload],dmgTaken:(G.ai.field[payload].dmgTaken||0)+totalDmg};addLog("💀 Décomposition: "+t.name+" -"+totalDmg+" PV (tout le poison d'un coup)!");}}}
    else if(ch.type==="repassuspec"){const t=G.ai.field[payload];if(t){G.ai.field[payload]={...t,_repassuspec:true};addLog("🍖 Repas Suspect: "+t.name+" perdra 100 PV après chaque attaque!");};}
    else if(ch.type==="technomasquepeste"){const t=G.ai.field[payload];if(t){G.fx.push({target:t.uid,bonus:-100,type:"atk",endOfTurn:true});addLog("🎭 Technomasque: "+t.name+" -100 ATK!");};}
    else if(ch.type==="labo_contrepoisons"){const c=G.player.field[payload];if(c){if(c._poisoned){G.dotEffects=G.dotEffects.filter(d=>d.uid!==c.uid);G.player.field[payload]={...c,_poisoned:false};addLog("🧬 Labo: "+c.name+" poison retiré !");}else{G.player.field[payload]={...c,dmgTaken:Math.max(0,(c.dmgTaken||0)-100)};addLog("🧬 Labo: "+c.name+" +100 PV!");}}}
    else if(ch.type==="equip_curse"){const t=G.ai.field[payload];if(t&&ch.cursedCard){if(!G.enemyEquips)G.enemyEquips=[];G.enemyEquips.push({id:ch.cursedCard.id,name:ch.cursedCard.name,targetUid:t.uid,side:"ai"});t._poisoned=true;// Apply immediate effect for Fiole
      if(ch.cursedCard.id==="fioletox"){G.dotEffects.push({uid:t.uid,side:"ai",dmgHp:100,turnsLeft:-1});}addLog(ch.cursedCard.name+" attaché à "+t.name+" !");}}
    else if(ch.type==="marchenoir"){const c=ch.options[payload];if(c){G.player.deck=G.player.deck.filter(x=>x.uid!==c.c.uid);G.player.hand.push({...c.c,uid:mkuid()});addLog("🏪 Marché Noir: "+c.c.name+" en main !");}}
  CHOICE=null;renderGame();
};

// ── AI TURN ──
window.doEndTurn=()=>{
  if(!G||G.phase!=="player"||CHOICE||ANIM_BUSY)return;
  // ── TRIO NINJA: proposer rappel en fin de tour ──────────
  const ninjaCount=G.player.field.filter(c=>c&&c.faction==="Ninjas").length;
  if(ninjaCount>=3&&G.ninjaTrio){
    G.ninjaTrio=false;// consomme le trigger
    const ninjaOpts=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.faction==="Ninjas");
    CHOICE={type:"ninja_trio_recall",options:ninjaOpts};
    renderGame();return;
  }
  G.phase="ai";G.firstTurn=false;SELECTED_HAND=null;ATTACK_MODE=false;ATTACK_FROM=null;
  addLog("IA joue...");
  renderGame();// Show "IA joue..." immediately
  AI_ANNOUNCE_QUEUE=[];
  drawCard("ai");
  G.frozenAI=false;
  // ── DOTS: Apply AI-side poison (effects on AI chars at start of AI turn) ──
  applyDotEffects("ai");
  if(G.phase==="end"){renderGame();return;}
  // ── TRIO SYNERGY IA ──
  checkTrioSynergy("ai");
  // Parthénon: +150 PV à tous les Grecs du joueur pendant le tour adverse
  if(G.lieu&&G.lieu.id==="parthenon"){
    G.player.field.forEach(c=>{if(c&&c.faction==="Grecs"){G.fx.push({target:c.uid,bonus:150,type:"hp",endOfTurn:true});}});
    addLog("Parthénon: tous vos Grecs +150 PV ce tour !");
  }
  G.fx=G.fx.filter(e=>!e.endOfTurn).map(e=>{
    if(e.turnsLeft!==undefined){
      if(e.turnsLeft<=1)return null;
      return{...e,turnsLeft:e.turnsLeft-1};
    }
    return e;
  }).filter(Boolean);
  G.sirenesTarget=null;
  G.player.field.forEach(c=>{if(c&&c.id==="nayra")c.nayraUsed=false;});
  G.ai.field.forEach(c=>{if(c&&c.id==="nayra")c.nayraUsed=false;});
  // Fureur end of turn
  if(G.fureurTarget){
    const fi=G.player.field.findIndex(c=>c&&c.uid===G.fureurTarget);
    if(fi!==-1){const c=G.player.field[fi];const ch=curHp(c,G.player,[],G.lieu);if(200>=ch){killCard("player",fi);addLog("Fureur: "+c.name+" détruit!");}else{c.dmgTaken=(c.dmgTaken||0)+200;addLog("Fureur: -200 PV.");}}
    G.fureurTarget=null;
  }
  const prevFrozen=[...G.frozenChars];G.frozenChars=[];
  G.player.field.forEach(c=>{if(c)c.justPlayed=false;});

  const diff=MATCHUP?.difficulty||"moyen";

  // ── AI PLAY CHARS ──────────────────────────────────────
  const handToPlay=[...G.ai.hand];
  if(diff==="difficile")handToPlay.sort((a,b)=>(b.cost||0)-(a.cost||0));
  else if(diff==="facile")handToPlay.sort((a,b)=>(a.cost||0)-(b.cost||0));

  for(let hi=0;hi<handToPlay.length;hi++){
    const c=handToPlay[hi];if(!c||c.type!=="personnage"||c.cost>G.turn)continue;
    if(c.isFusion)continue;
    const slot=G.ai.field.findIndex(f=>!f);if(slot===-1)break;
    const placed={...c,dmgTaken:0,hasAttacked:false,justPlayed:true,bonusAtk:0,bonusHp:0,uid:mkuid()};
    G.ai.field[slot]=placed;
    const idx=G.ai.hand.findIndex(x=>x.uid===c.uid);
    if(idx!==-1)G.ai.hand.splice(idx,1);
    addLog("IA pose: "+c.name);
    queueAiAnnounce(
      "L'adversaire invoque",
      "play",
      `<strong style="color:#f0c060">${c.name}</strong>${c.faction?` · ${c.faction}`:""}${c.atk?`<br>⚔️ ${c.atk} ATK  ❤️ ${c.hp} PV`:""}`,
      1800
    );
    // Entry effects
    if(c.id==="zyra"){queueAiAnnounce(`${c.name} : détruit toutes les cartes coût ≤2 !`,"power","Pouvoir d'entrée",1400);["player","ai"].forEach(w=>{G[w].field.forEach((x,j)=>{if(x&&x.cost<=2){killCard(w,j);stealPrestige("ai","Zyra détruit "+x.name+"!");}});});}
    if(c.id==="hurgan"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){const t=G.player.field[ti];G.player.field[ti]=null;G.player.equips[ti]=[null,null];G.player.hand.push({...t,uid:mkuid()});queueAiAnnounce(`${c.name} renvoie ${t.name} en main !`,"effect","Pouvoir d'entrée",1400);addLog("Hurgan IA: "+t.name+" renvoyé!");}}
    if(c.id==="freyja"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-200,type:"atk",endOfTurn:true});queueAiAnnounce(`${c.name} affaiblit ${G.player.field[ti].name} de 200 ATK`,"effect","",1200);addLog("Freyja IA: -200 ATK!");}}
    if(c.id==="haldor"||c.id==="ylvabaies"){const al=G.ai.field.filter((x,j)=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){al[0].bonusHp=(al[0].bonusHp||0)+100;queueAiAnnounce(`${al[0].name} gagne +100 PV !`,"effect","Synergie Viking",1200);}}
    if(c.id==="petittorvald"){const al=G.ai.field.filter((x,j)=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){G.fx.push({target:al[0].uid,bonus:100,type:"atk",endOfTurn:true});queueAiAnnounce(`${al[0].name} gagne +100 ATK !`,"effect","Synergie Viking",1200);}}
    if(c.id==="astrid"){const al=G.ai.field.filter(x=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){G.fx.push({target:al[0].uid,bonus:200,type:"atk",endOfTurn:true});queueAiAnnounce(`${al[0].name} gagne +200 ATK !`,"effect","Astrid",1200);}}
    if(c.id==="kaya"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-200,type:"atk",endOfTurn:true});const hov=G.ai.field.some(x=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(hov)G.fx.push({target:placed.uid,bonus:200,type:"atk",endOfTurn:true});queueAiAnnounce(`Kaya affaiblit ${G.player.field[ti].name} de 200 ATK`,"effect","",1200);}}
    if(c.id==="porteur"){const eq=G.ai.deck.find(x=>x.type==="equipement");if(eq){G.ai.deck=G.ai.deck.filter(x=>x.uid!==eq.uid);G.ai.hand.push(eq);queueAiAnnounce(`${c.name} pioche un équipement`,"effect","",1200);}}
  }

  // ── AI PLAY EQUIPMENT ─────────────────────────────────
  const eqChance=diff==="facile"?0:diff==="moyen"?0.5:1;
  G.ai.hand.filter(c=>c&&c.type==="equipement").forEach(c=>{
    if(Math.random()>eqChance)return;
    const target=G.ai.field.find(f=>f&&f.faction===c.faction);
    if(!target)return;
    const tfi=G.ai.field.findIndex(f=>f&&f.uid===target.uid);
    const eSlot=G.ai.equips[tfi].findIndex(e=>!e);
    if(eSlot===-1)return;
    G.ai.equips[tfi][eSlot]=c;
    G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);
    addLog("IA équipe: "+c.name+" sur "+target.name);
    queueAiAnnounce(`Équipe ${target.name}`,`power`,`🛡️ ${c.name}`,1300);
  });

  // ── AI PLAY ACTIONS ───────────────────────────────────
  // facile: never plays actions. moyen: plays ~1 action. difficile: plays all useful actions
  const maxActions=diff==="facile"?0:diff==="moyen"?1:99;
  let actionsPlayed=0;
  const aiActions=[...G.ai.hand.filter(c=>c&&c.type==="action")];
  // Sort: difficile prioritizes offensive actions
  if(diff==="difficile")aiActions.sort((a,b)=>{
    const priority=["planche","bombe","abordage","explosion","cataclysme","tempetesable","colerara","appeldieux","fureurberserker","benedictionpere","fracastonneroc","frappetonnerre"];
    return priority.indexOf(b.id)-priority.indexOf(a.id);
  });

  for(const c of aiActions){
    if(actionsPlayed>=maxActions)break;
    if(G.arcaneBreaker){G.arcaneBreaker=false;addLog("Briseur annule "+c.name+"!");G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);continue;}
    let played=false;
    const playerField=G.player.field.filter(x=>x);
    const aiField=G.ai.field.filter(x=>x);
    const weakestPlayer=playerField.length?playerField.reduce((a,b)=>curHp(a,G.player,G.fx,G.lieu)<curHp(b,G.player,G.fx,G.lieu)?a:b):null;
    const strongestAI=aiField.length?aiField.reduce((a,b)=>calcAtk(a,G.ai,G.fx,G.lieu,false)>calcAtk(b,G.ai,G.fx,G.lieu,false)?a:b):null;
    const weakestAI=aiField.length?aiField.reduce((a,b)=>curHp(a,G.ai,G.fx,G.lieu)<curHp(b,G.ai,G.fx,G.lieu)?a:b):null;

    // Offensive actions targeting player
    if(c.id==="planche"||c.id==="impactcible"){
      const ti=G.player.field.findIndex(x=>x&&curHp(x,G.player,G.fx,G.lieu)<=400);
      if(ti!==-1){const name=G.player.field[ti].name;killCard("player",ti);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);played=true;}
    } else if(c.id==="abordage"||c.id==="frappenforcee"||c.id==="iskra"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:200,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +200 ATK!");queueAiAnnounce(`${c.name} — ${strongestAI.name} +200 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="benedictionpere"){
      const v=G.ai.field.find(x=>x&&x.faction==="Vikings");if(v){G.fx.push({target:v.uid,bonus:200,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +200!");queueAiAnnounce(`Bénédiction du Père — ${v.name} +200 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="bombe"||c.id==="explosion"){
      if(playerField.length){
        const pfi=G.player.field.findIndex(x=>x&&curHp(x,G.player,G.fx,G.lieu)<=300);
        if(pfi!==-1){const name=G.player.field[pfi].name;killCard("player",pfi);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);played=true;}
        else if(weakestPlayer){const pfi2=G.player.field.indexOf(weakestPlayer);const ch=curHp(weakestPlayer,G.player,G.fx,G.lieu)-200;if(ch<=0){const name=weakestPlayer.name;killCard("player",pfi2);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);}else{G.player.field[pfi2]={...weakestPlayer,dmgTaken:(weakestPlayer.dmgTaken||0)+200};addLog("IA "+c.name+": -200 PV!");queueAiAnnounce(`${c.name} inflige 200 dégâts à ${weakestPlayer.name} !`,"damage","",1300);}played=true;}
      }
    } else if(c.id==="cataclysme"){
      [...G.player.field].forEach((x,j)=>{if(x&&curHp(x,G.player,G.fx,G.lieu)<=200){const name=x.name;killCard("player",j);stealPrestige("ai","Cataclysme: "+name+"!");}});queueAiAnnounce(`Cataclysme — détruit tous les personnages blessés !`,"destroy","",1400);played=true;
    } else if(c.id==="tempetesable"||c.id==="eclipsera"){
      G.player.field.forEach(x=>{if(x)G.fx.push({target:x.uid,bonus:-200,type:"atk",endOfTurn:true});});addLog("IA "+c.name+": tous -200 ATK!");queueAiAnnounce(`${c.name} — tous vos personnages -200 ATK !`,"effect","",1400);played=true;
    } else if(c.id==="fureurberserker"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:400,type:"atk",endOfTurn:true});G.fureurTarget=strongestAI.uid;addLog("IA Fureur: +400 ATK!");queueAiAnnounce(`Fureur Berserker — ${strongestAI.name} +400 ATK !`,"power","⚠️ Perdra 200 PV à la fin du tour",1500);played=true;}
    } else if(c.id==="frappetonnerre"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:300,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +300!");queueAiAnnounce(`${c.name} — ${strongestAI.name} +300 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="appeldieux"){
      G.ai.field.forEach(x=>{if(x&&x.faction==="Egyptiens")G.fx.push({target:x.uid,bonus:200,type:"atk",endOfTurn:true});});addLog("IA Appel des Dieux!");queueAiAnnounce(`Appel des Dieux — tous les Égyptiens +200 ATK !`,"power","",1400);played=true;
    } else if(c.id==="surcroit"){
      if(weakestAI){G.fx.push({target:weakestAI.uid,bonus:200,type:"hp",endOfTurn:false});addLog("IA Surcroît: +200 PV!");queueAiAnnounce(`Surcroît — ${weakestAI.name} +200 PV !`,"effect","",1300);played=true;}
    } else if(c.id==="fracastonneroc"){
      const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-300,type:"atk",endOfTurn:true});addLog("IA Fracas: -300 ATK!");played=true;}
    } else if(c.id==="chargespartiate"||c.id==="pluiejavelots"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:300,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +300!");played=true;}
    } else if(c.id==="colerezeus"){
      const ti=G.player.field.findIndex(x=>x);if(ti!==-1){const t=G.player.field[ti];const ch=curHp(t,G.player,G.fx,G.lieu);if(300>=ch){killCard("player",ti);stealPrestige("ai","Colère Zeus: détruit!");}else{G.player.field[ti]={...t,dmgTaken:(t.dmgTaken||0)+300};}played=true;}
    } else if(c.id==="reveilcolosse"){
      G.ai.field.forEach(x=>{if(x&&x.faction==="Grecs")G.fx.push({target:x.uid,bonus:200,type:"hp",endOfTurn:true});});addLog("IA Réveil Colosse: +200 PV!");played=true;
    }

    if(played){G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);actionsPlayed++;}
  }

  // ── AI ATTACKS ────────────────────────────────────────
  // difficile: attacks weakest player first to get kills, moyen: normal, facile: random target
  G.ai.field.forEach((atk,i)=>{
    if(!atk||G.frozenAI||atk.hasAttacked||prevFrozen.includes(atk.uid)||G.phase==="end")return;
    // Grève des Ouvriers: paralysie temporaire
    if(atk._greve&&atk._greve>0){atk._greve--;addLog("🪧 Grève: "+atk.name+" paralysé ce tour.");return;}
    const ptgts=G.player.field.map((c,pi)=>({c,i:pi})).filter(x=>x.c&&!(x.c._nikoProtectExpires&&G.turn<=x.c._nikoProtectExpires&&(atk.cost||0)>4));
    let ttype="prestige",tfi=-1;
    if(ptgts.length>0){
      let forcedTarget=null;
      if(G.sirenesTarget&&G.sirenesTarget.enemyUid===atk.uid){
        const si=G.player.field.findIndex(c=>c&&c.uid===G.sirenesTarget.sireneUid);
        if(si!==-1)forcedTarget=si;
        G.sirenesTarget=null;
      }
      if(forcedTarget!==null){ttype="field";tfi=forcedTarget;}
      else{
        // Maru Muraille Ronde: force AI to target Maru if present
        const maruI=G.player.field.findIndex(c=>c&&c.id==="marumuraille");
        if(maruI!==-1){ttype="field";tfi=maruI;}
        else if(diff==="difficile"){
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const killable=pool.find(({c})=>calcAtk(atk,G.ai,G.fx,G.lieu,false)>=curHp(c,G.player,G.fx,G.lieu));
          const chosen=killable||pool.reduce((b,x)=>curHp(x.c,G.player,G.fx,G.lieu)<curHp(b.c,G.player,G.fx,G.lieu)?x:b);
          ttype="field";tfi=chosen.i;
        } else if(diff==="facile"){
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const rand=pool[Math.floor(Math.random()*pool.length)];
          ttype="field";tfi=rand.i;
        } else {
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const t=pool.reduce((b,x)=>curHp(x.c,G.player,G.fx,G.lieu)<curHp(b.c,G.player,G.fx,G.lieu)?x:b);
          ttype="field";tfi=t.i;
        }
      }
    }
    if(G.phase!=="end"){
      const tgtName=ttype==="field"&&G.player.field[tfi]?G.player.field[tfi].name:"vos points de Prestige";
      const beforeHp=ttype==="field"&&G.player.field[tfi]?curHp(G.player.field[tfi],G.player,G.fx,G.lieu):null;
      resolveCombat("ai",i,ttype,tfi);
      if(G.phase!=="end"){
        // Check if target survived or was destroyed
        const targetDied=ttype==="field"&&!G.player.field[tfi];
        if(targetDied){
          queueAiAnnounce(`${atk.name} détruit ${tgtName} !`,"destroy",`⚔️ ${calcAtk(atk,G.ai,G.fx,G.lieu,false)} ATK`,1600);
        } else if(ttype==="prestige"){
          queueAiAnnounce(`${atk.name} attaque votre Prestige !`,"attack","",1300);
        } else {
          const afterHp=ttype==="field"&&G.player.field[tfi]?curHp(G.player.field[tfi],G.player,G.fx,G.lieu):null;
          const dmgDone=beforeHp&&afterHp?beforeHp-afterHp:null;
          queueAiAnnounce(
            `${atk.name} attaque ${tgtName}`,
            "attack",
            dmgDone?`${tgtName} perd ${dmgDone} PV (→ ${afterHp} restants)`:"",
            1500
          );
        }
      }
    }
  });
  // Reset Moku protection and Yumi ATK at start of NEXT player turn (done in turn start)

  if(G.phase!=="end"){
    G.turn++;G.phase="player";
    drawCard("player");
    // ── DOTS: Apply player-side poison (effects on player chars at start of player turn) ──
    applyDotEffects("player");
    if(G.phase==="end"){renderGame();return;}
    G.player.field.forEach(c=>{if(c)c.hasAttacked=false;});
    G.ai.field.forEach(c=>{if(c){c.hasAttacked=false;c.justPlayed=false;}});
    addLog("Tour "+G.turn+" — Votre tour!");
    checkTrioSynergy("player");
    if(G.lieu&&G.lieu.id==="villagenil"){G.player.field.forEach(c=>{if(c&&c.faction==="Egyptiens"){c.dmgTaken=Math.max(0,(c.dmgTaken||0)-100);}});addLog("Village du Nil: Egyptiens +100 PV!");}
    if(G.lieu&&G.lieu.id==="villagetipis"){G.player.field.forEach(c=>{if(c&&c.faction==="Amerindiens"&&c.dmgTaken>0){c.dmgTaken=Math.max(0,c.dmgTaken-100);}});addLog("Village des Tipis: Amérindiens blessés +100 PV!");}
    if(G.lieu&&G.lieu.id==="canyonesprits")G.lieu.canyonUsed=false;
    if(G.player.field.some(c=>c&&c.id==="pretresselune")){G.player.field.forEach(c=>{if(c&&c.faction==="Amerindiens"){c.dmgTaken=Math.max(0,(c.dmgTaken||0)-150);}});addLog("Prêtresse: tous Amérindiens +150 PV!");}
    G.player.field.forEach(c=>{if(c&&c.id==="portepeaux")c.portepeauxUsed=false;});
    G.ai.field.forEach(c=>{if(c&&c.id==="portepeaux")c.portepeauxUsed=false;});
    G.egyptShield=false;
    G.artemisTarget=null;
    if(G.lieu&&G.lieu.id==="olympe")G.lieu.olympeUsedTurn=null;
    // Reset Ninja flags
    G.player.field.forEach(c=>{if(c){c._mokuProtected=false;c._yumiZero=false;c._canBypassField=false;c._technomaskUsed=false;}});
    G.maruTauntUid=null;G.marqueTarget=null;G.fumigUsedTurn=false;
    G.lieu&&(G.lieu.jardinUsed=false);G.lieu&&(G.lieu.usineUsed=false);
    G.laboCooldown=false;G.ninjaTrio=false;
    G.empoisonneurTrio=G.player.field.filter(c=>c&&c.faction==="Empoisonneurs").length>=3;
    // Manoir du Baron: début de tour → pioche 1 + remets 1 si Steampunk équipé
    if(G.lieu&&G.lieu.id==="manoirbaron"&&G.player.field.some((c,j)=>c&&c.faction==="Steampunk"&&eqs(G.player.equips,c.uid).find(e=>e))){
      drawCard("player");
      if(G.player.hand.length>0){setTimeout(()=>{CHOICE={type:"manoir_remise",options:G.player.hand.map((c,i)=>({c,i}))};renderGame();},200);}
    }
    // Apply Kunai poison DoT
    G.fx=G.fx.map(e=>{
      if(e.type==="poison"&&e.turnsLeft!==undefined){
        const fi=G.ai.field.findIndex(c=>c&&c.uid===e.target);
        if(fi!==-1){const ch=curHp(G.ai.field[fi],G.ai,G.fx.filter(x=>x!==e),G.lieu);if(100>=ch){killCard("ai",fi);stealPrestige("player","Kunai poison détruit "+G.ai.field[fi]?.name||"ennemi"+"!");}else if(G.ai.field[fi]){G.ai.field[fi]={...G.ai.field[fi],dmgTaken:(G.ai.field[fi].dmgTaken||0)+100};addLog("Poison Kunai: -100 PV !");}}
        return null;
      }
      return e;
    }).filter(Boolean);
    checkDeckOut();
  }
  // Show AI actions progressively, then renderGame
  flushAiAnnounce(()=>{renderGame();});
};

// ═══════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════
render();
</script>
