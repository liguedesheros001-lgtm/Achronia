      }
      // Sören Briquet-Noir: riposte 100 dégâts à l'attaquant quand il est attaqué
      if(def&&def.id==="sorenbriquetenoir"){
        G[who].field[afi]={...G[who].field[afi],dmgTaken:(G[who].field[afi].dmgTaken||0)+100};
        addLog("Sören: riposte, "+atk.name+" -100 PV !");
        const atkHpAfter3=curHp(G[who].field[afi],G[who],G.fx,G.lieu);
        if(atkHpAfter3<=0){killCard(who,afi);stealPrestige(en,atk.name+" détruit par la riposte de Sören !");}
      }
      // Gluvermine d'Acide: riposte 50 dégâts à l'attaquant quand elle est attaquée
      if(def&&def.id==="gluverminedacide"){
        G[who].field[afi]={...G[who].field[afi],dmgTaken:(G[who].field[afi].dmgTaken||0)+50};
        addLog("Gluvermine: riposte acide, "+atk.name+" -50 PV !");
        const atkHpAfter4=curHp(G[who].field[afi],G[who],G.fx,G.lieu);
        if(atkHpAfter4<=0){killCard(who,afi);stealPrestige(en,atk.name+" détruit par l'acide de Gluvermine !");}
      }
      // Pic-Punk le Fakir: riposte 50 dégâts à l'attaquant quand il est attaqué
      if(def&&def.id==="picpunklefakir"){
        G[who].field[afi]={...G[who].field[afi],dmgTaken:(G[who].field[afi].dmgTaken||0)+50};
        addLog("Pic-Punk: riposte, "+atk.name+" -50 PV !");
        const atkHpAfter5=curHp(G[who].field[afi],G[who],G.fx,G.lieu);
        if(atkHpAfter5<=0){killCard(who,afi);stealPrestige(en,atk.name+" détruit par la riposte du Fakir !");}
      }
      if(who==="player"){
        if(atk.id==="braxboxeur"){const others=G.ai.field.filter(c=>c&&c.uid!==def.uid);if(others.length){others[0].dmgTaken+=100;addLog("Brax: 100 dégâts à "+others[0].name+" !");}}
        if(atk.id==="khantor"){const eq=G.player.field.filter(c=>c&&c.type==="equipement").length;if(eq>0){G.fx.push({target:atk.uid,bonus:100*eq,type:"atk",endOfTurn:true});addLog("Khan-Tor: +"+100*eq+" ATK ("+eq+" équipement(s)) !");}}
        if(atk.id==="nereus02"){const bl=G.ai.field.find(c=>c&&c.dmgTaken>0&&c.uid!==def.uid);if(bl){bl.dmgTaken+=200;addLog("Néréus-02: 200 dégâts bonus à "+bl.name+" !");}}
        if(atk.id==="crocmetal"&&atk.dmgTaken>0){G.fx.push({target:atk.uid,bonus:300,type:"atk",endOfTurn:true});addLog("Croc-Métal: +300 ATK car blessé !");}
        // Bras Modulaire Cybernétique: 1x/tour, 100 dégâts à un autre ennemi
        if(!atk._brasUsed){const brasMod=eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="brasmodulaire");if(brasMod){const others=G.ai.field.filter(c=>c&&c.uid!==def.uid);if(others.length){others[0].dmgTaken+=100;atk._brasUsed=true;addLog("⚙️ Bras Modulaire: 100 dégâts à "+others[0].name+" !");}}}
        // Molly Meuh-Rage: -50 PV après attaque
        if(atk.id==="mollymeurage"){const mfi2=G.player.field.findIndex(c=>c&&c.uid===atk.uid);if(mfi2!==-1){G.player.field[mfi2]={...G.player.field[mfi2],dmgTaken:(G.player.field[mfi2].dmgTaken||0)+50};addLog("Molly: -50 PV !");}}
        // Kaora Brise-Ring: si blesse (ennemi survit), gel
        if(atk.id==="kaorabrisering"&&G.ai.field[tfi]){const kch=curHp(G.ai.field[tfi],G.ai,G.fx,G.lieu);if(kch>0){G.ai.field[tfi]={...G.ai.field[tfi],_frozen:true};addLog("Kaora: "+G.ai.field[tfi].name+" gelé !");}}
        // Hache du Stop: après kill, renvoie un autre ennemi coût ≤2 en main adverse
        if(eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="hachedestop")&&!G.ai.field[tfi]){
          const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&(x.c.cost||0)<=2);
          if(opts.length===1){const t=opts[0];G.ai.field[t.i]=null;G.ai.equips[t.i]=[null,null];G.ai.hand.push({...t.c,uid:mkuid(),dmgTaken:0,bonusAtk:0,bonusHp:0,hasAttacked:false,justPlayed:false});addLog("Hache du Stop: "+t.c.name+" renvoyé en main !");}
          else if(opts.length>1)setTimeout(()=>{CHOICE={type:"hachedestop_bounce",options:opts};renderGame();},300);
        }
        // Spider-Punk Pochtron: kill ennemi coût ≥4 → pioche 1
        if(atk.id==="spiderpunkpochtron"&&G.ai.field[tfi]){const spch=curHp(G.ai.field[tfi],G.ai,G.fx,G.lieu);if(spch<=0&&(def.cost||0)>=4&&G.player.deck.length>0){G.player.hand.push(G.player.deck.shift());addLog("Spider-Punk: ennemi ≥4 tué → pioche 1 !");}}
        // Vénéra Pic-de-Toxine: empoisonne l'ennemi attaqué (20 PV/tour)
        if(atk.id==="veneapictoxine"&&G.ai.field[tfi]&&!G.ai.field[tfi]._poisoned){poisonChar("ai",G.ai.field[tfi].uid,20,-1);addLog("Vénéra: "+def.name+" empoisonné(e) (-20 PV/tour) !");}
        // Doros l'Exilé: +100 ATK vs Primitifs
        if(atk.id==="doroslexile"&&["Amazones","Amerindiens"].includes(def.faction)){G.fx.push({target:atk.uid,bonus:100,type:"atk",endOfTurn:true});addLog("Doros: +100 ATK contre Primitifs !");}
        // Billy Crête-Féroce: quand il attaque, toutes les autres unités ennemies perdent 100 PV
        if(atk.id==="billycretferoce"){
          G.ai.field.forEach((c,i)=>{
            if(!c||i===tfi)return;
            c.dmgTaken=(c.dmgTaken||0)+100;
            const ch2=curHp(c,G.ai,G.fx,G.lieu);
            if(ch2<=0){killCard("ai",i);stealPrestige("player",c.name+" détruit par Billy !");}
            else addLog("Billy: "+c.name+" -100 PV !");
          });
        }
        // Vibra Guitare Sismique: 100 dégâts à tous les AUTRES ennemis quand elle attaque
        if(atk.id==="vibraguitaresismique"){
          G.ai.field.forEach((c,i)=>{if(!c||i===tfi)return;c.dmgTaken=(c.dmgTaken||0)+100;const ch2=curHp(c,G.ai,G.fx,G.lieu);if(ch2<=0){killCard("ai",i);stealPrestige("player",c.name+" détruit !");}else addLog("Vibra: "+c.name+" -100 PV !");});
        }
        // Bombedetag: choisit une carte de la main adverse à défausser
        if(eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="bombedetag")&&G.ai.hand.length){
          const handOpts=G.ai.hand.map((c,i)=>({c,i}));
          setTimeout(()=>{CHOICE={type:"bombedetag_discard",options:handOpts};renderGame();},250);
        }
        // Guitare du Chaos: renvoie un ennemi coût ≤2 en main adverse
        if(eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="guitarduchaos")){
          const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.i!==tfi&&(x.c.cost||0)<=2);
          if(opts.length===1){const t=opts[0];G.ai.field[t.i]=null;G.ai.equips[t.i]=[null,null];G.ai.hand.push({...t.c,uid:mkuid(),dmgTaken:0,bonusAtk:0,bonusHp:0,hasAttacked:false,justPlayed:false});addLog("Guitare: "+t.c.name+" renvoyé en main !");}
          else if(opts.length>1)setTimeout(()=>{CHOICE={type:"guitare_bounce",options:opts};renderGame();},250);
        }
        // Poing Sono: -100 ATQ à l'ennemi ciblé pendant 2 tours
        if(eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="poingsono")&&G.ai.field[tfi]){
          G.fx.push({target:G.ai.field[tfi].uid,bonus:-100,type:"atk",endOfTurn:false,expiresAtTurn:G.turn+2});
          addLog("Poing Sono: "+def.name+" -100 ATQ pendant 2 tours !");
        }
        // Batte Hérissée: un allié subit 50 dégâts
        if(eqs(G.player.equips,atk.uid).find(e=>e&&e.id==="batteherissee")){
          const ally=G.player.field.find(c=>c&&c.uid!==atk.uid);
          if(ally){ally.dmgTaken=(ally.dmgTaken||0)+50;addLog("Batte Hérissée: "+ally.name+" -50 PV (effet de recul) !");}
        }
        // Cavalière No Future: 50 dégâts à un ennemi aléatoire quand elle attaque
        if(atk.id==="cavaliernofuture"){
          const others=G.ai.field.filter(c=>c&&c.uid!==def.uid);
          if(others.length){const rnd=others[Math.floor(Math.random()*others.length)];rnd.dmgTaken=(rnd.dmgTaken||0)+50;addLog("Cavalière: "+rnd.name+" -50 PV (aléatoire) !");}
        }
        // Gorillaz le Massacreur: peut renvoyer un ennemi coût ≤3 en main adverse après attaque
        if(atk.id==="gorillazlemassacreur"){
          const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&(x.c.cost||0)<=3);
          if(opts.length)setTimeout(()=>{CHOICE={type:"gorillaz_bounce",options:opts};renderGame();},200);
        }
        // Major Carnage: après kill, 150 dégâts à un autre ennemi
        if(atk.id==="majorcarnage"&&G.ai.field[tfi]){
          const defHp=curHp(G.ai.field[tfi],G.ai,G.fx,G.lieu);
          if(defHp<=0){
            const others=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.i!==tfi);
            if(others.length)setTimeout(()=>{CHOICE={type:"major_carnage_bonus",options:others};renderGame();},300);
          }
        }
        // Nahko (Chrono-Légendaire Amérindien): après avoir attaqué, +100×coût PV à un allié Amérindien
        if(atk.faction==="Amerindiens"&&atk.isChronoLegendaire&&!atk.isAvatar){
          const healAmt=(atk.cost||0)*100;
          const ally=G.player.field.find(c=>c&&c.faction==="Amerindiens"&&c.uid!==atk.uid);
          if(ally){ally.dmgTaken=Math.max(0,ally.dmgTaken-healAmt);addLog(atk.name+": "+ally.name+" +"+healAmt+" PV !");}
        }
        // Thalor (Chrono-Légendaire Grec): après avoir attaqué, inflige grade×100 dégâts supplémentaires à une cible choisie
        if(atk.faction==="Grecs"&&atk.isChronoLegendaire&&!atk.isAvatar){
          const bonusDmg=(atk.chronoGrade||1)*100;
          const enemies=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);
          if(enemies.length)setTimeout(()=>{CHOICE={type:"thalor_target",options:enemies,bonusDmg};renderGame();},100);
        }
      }
      // Repas Suspect: après attaque l'attaquant perd 100 PV
      if(ttype==="field"){const attackerIdx=G[who].field.findIndex(c=>c&&c.uid===atk.uid);if(attackerIdx!==-1&&G[who].field[attackerIdx]&&G[who].field[attackerIdx]._repassuspec){const rpc=G[who].field[attackerIdx];const rpch=curHp(rpc,G[who],G.fx,G.lieu);if(100>=rpch){killCard(who,attackerIdx);stealPrestige(en,"Repas Suspect: "+rpc.name+" détruit!");}else{G[who].field[attackerIdx]={...rpc,dmgTaken:(rpc.dmgTaken||0)+100};addLog("🍖 Repas Suspect: "+rpc.name+" -100 PV après attaque!");}}}
      // Bombe de Gaz (cursed on attacker): perd 100 PV après attaque
      if(ttype==="field"){const atkNow=G[who].field.findIndex(c=>c&&c.uid===atk.uid);if(atkNow!==-1&&G[who].field[atkNow]){const beq=G.enemyEquips&&G.enemyEquips.find(e=>e.id==="bombegaz"&&e.targetUid===atk.uid);if(beq){const bc=G[who].field[atkNow];const bch=curHp(bc,G[who],G.fx,G.lieu);if(100>=bch){killCard(who,atkNow);stealPrestige(en,"Bombe de Gaz: "+bc.name+" détruit!");}else{G[who].field[atkNow]={...bc,dmgTaken:(bc.dmgTaken||0)+100};addLog("💣 Bombe de Gaz: "+bc.name+" -100 PV !");}}}}
      // Anubis: 1x/tour, quand un ennemi perd ATK il perd aussi autant en PV
      // (géré séparément via les fx - voir applyAnubisEffect)
      const deq=eqs(G[en].equips,def.uid);
      if(deq.find(e=>e.id==="pierrerunique")&&def.faction==="Vikings")G.fx.push({target:def.uid,bonus:100,type:"atk",endOfTurn:true});
      if(atk.id==="barbe"){
        const oi=G[en].field.findIndex((c,i)=>c&&i!==tfi);
        if(oi!==-1){const o=G[en].field[oi];const oh=curHp(o,G[en],G.fx,G.lieu)-50;if(oh<=0){killCard(en,oi);stealPrestige(who,"Barbe detruit "+o.name+"!");}else{G[en].field[oi]={...o,dmgTaken:(o.dmgTaken||0)+50};}}
      }
    }
    if(G.phase!=="end"){
      if(atk.id==="thorgal"||atk.id==="arya"||atk.id==="cavalierbison"||atk.id==="cyclopebrise"){        const oi=G[en].field.findIndex((c,i)=>c&&i!==tfi);
        if(oi!==-1){const o=G[en].field[oi];const oh=curHp(o,G[en],G.fx,G.lieu)-100;if(oh<=0){killCard(en,oi);stealPrestige(who,atk.name+" detruit "+o.name+"!");}else{G[en].field[oi]={...o,dmgTaken:(o.dmgTaken||0)+100};addLog(atk.name+": 100 degats a "+o.name);}}
      }
      // Pistache Turbo-Patte: +50 ATK si cible déjà blessée
      if(atk.id==="pistacheturbo"&&ttype==="field"&&G[en].field[tfi]&&(G[en].field[tfi].dmgTaken||0)>0){G.fx.push({target:atk.uid,bonus:50,type:"atk",endOfTurn:true});addLog("Pistache Turbo: +50 ATK (cible blessée) !");}
      // Lance-Flamme au Charbon: cible touchée perd 100 PV à son prochain tour
      if(isP&&ttype==="field"&&G[en].field[tfi]){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="lanceflammecharbon")){poisonChar(en,G[en].field[tfi].uid,100,1);addLog("🔥 Lance-Flamme: "+def.name+" -100 PV au prochain tour !");}}
      // Scie-Gantelet: inflige 100 dégâts à un autre ennemi
      if(isP&&ttype==="field"){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="sciegantelet")){const other=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.i!==tfi);if(other.length){const t2=other[0];const ch2=curHp(t2.c,G.ai,G.fx,G.lieu);if(100>=ch2){killCard("ai",t2.i);stealPrestige("player","Scie-Gantelet détruit "+t2.c.name+"!");}else{G.ai.field[t2.i]={...t2.c,dmgTaken:(t2.c.dmgTaken||0)+100};addLog("⚙️ Scie-Gantelet: "+t2.c.name+" -100 PV !");}}}}
      // Fusil à Vapeur Instable: porteur perd 100 PV après combat
      if(isP&&ttype==="field"){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="fusilvapeur")){const afi2=G.player.field.findIndex(c=>c&&c.uid===atk.uid);if(afi2!==-1&&G.player.field[afi2]){const pc=G.player.field[afi2];const pch=curHp(pc,G.player,G.fx,G.lieu);if(100>=pch){killCard("player",afi2);addLog("💥 Fusil Instable: "+pc.name+" détruit !");}else{G.player.field[afi2]={...pc,dmgTaken:(pc.dmgTaken||0)+100};addLog("💥 Fusil Instable: "+pc.name+" -100 PV après attaque !");}}}}
      // Grenade à Charbon: auto-détruit après la première attaque
      if(isP&&ttype==="field"){const eq2=eqs(G.player.equips,atk.uid);const grenIdx=G.player.equips[G.player.field.findIndex(c=>c&&c.uid===atk.uid)]?.findIndex(e=>e&&e.id==="grenadecharbon");const afi3=G.player.field.findIndex(c=>c&&c.uid===atk.uid);if(afi3!==-1&&grenIdx!==undefined&&grenIdx>=0){G.player.equips[afi3][grenIdx]=null;addLog("💣 Grenade à Charbon détruite après l'attaque !");}}
      // Dague au Venin Noir: inflige 100 PV dot au prochain tour
      if(isP&&atk.faction==="Empoisonneurs"&&ttype==="field"&&G[en].field[tfi]){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="daguevenin")){poisonChar(en,G[en].field[tfi].uid,100,1);addLog("🗡️ Dague Venin: "+def.name+" -100 PV prochain tour!");}}
      // Sarbacane du Lotus: cible -100 ATK prochain tour
      if(isP&&atk.faction==="Empoisonneurs"&&ttype==="field"&&G[en].field[tfi]){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="sarbacane")){G.fx.push({target:G[en].field[tfi].uid,bonus:-100,type:"atk",endOfTurn:true});addLog("🎯 Sarbacane: "+def.name+" -100 ATK !");}}
      // Canne-Lame Alchimiste: +100 dégâts si cible empoisonnée
      if(isP&&atk.faction==="Empoisonneurs"&&ttype==="field"&&G[en].field[tfi]&&G[en].field[tfi]._poisoned){const eq2=eqs(G.player.equips,atk.uid);if(eq2.find(e=>e.id==="cannelame")){const ctgt=G[en].field[tfi];const ch2=curHp(ctgt,G[en],G.fx,G.lieu);if(100>=ch2){killCard(en,tfi);stealPrestige(who,"Canne-Lame: "+ctgt.name+" détruit!");}else{G[en].field[tfi]={...ctgt,dmgTaken:(ctgt.dmgTaken||0)+100};addLog("🧪 Canne-Lame: +100 dégâts (cible empoisonnée) !");}}}
      // Bombe de Gaz (cursed): après attaque l'ennemi perd 100 PV
      if(ttype==="field"&&G[who].field[afi]){const bombedTarget=G[who].field[afi];const beq=G.enemyEquips&&G.enemyEquips.find(e=>e.id==="bombegaz"&&e.targetUid===bombedTarget?.uid);if(beq){const bi=G[who].field.findIndex(c=>c&&c.uid===bombedTarget.uid);if(bi!==-1&&G[who].field[bi]){const bch=curHp(G[who].field[bi],G[who],G.fx,G.lieu);if(100>=bch){killCard(who,bi);stealPrestige(en,"Bombe de Gaz: "+bombedTarget.name+" détruit!");}else{G[who].field[bi]={...G[who].field[bi],dmgTaken:(G[who].field[bi].dmgTaken||0)+100};addLog("💣 Bombe de Gaz: "+bombedTarget.name+" -100 PV après attaque!");}}}}
      // Cavalier Mécanique Sparte: après son attaque, un autre Grec allié +100 ATK
      if(atk.id==="cavaliersparte"){
        const al=G[who].field.filter(c=>c&&c.faction==="Grecs"&&c.uid!==atk.uid);
        if(al.length>0){G.fx.push({target:al[0].uid,bonus:100,type:"atk",endOfTurn:true});addLog(al[0].name+" +100 ATK (Cavalier Sparte)!");}
      }
      // Maîtresse des Raptors: 100 dégâts à 2 ennemis différents
      if(atk.id==="maitresseraptors"&&G.phase!=="end"){const others=G[en].field.map((c,i)=>({c,i})).filter(x=>x.c&&x.i!==tfi);others.slice(0,2).forEach(({c:o,i:oi})=>{if(G.phase==="end")return;const oh=curHp(o,G[en],G.fx,G.lieu)-100;if(oh<=0){killCard(en,oi);stealPrestige(who,"Raptors: "+o.name+" détruit!");}else if(G[en].field[oi]){G[en].field[oi]={...G[en].field[oi],dmgTaken:(G[en].field[oi].dmgTaken||0)+100};addLog("Raptors: 100 dégâts à "+o.name);}});}
      // Chasseur des Profondeurs: cible -200 ATK
      if(atk.id==="chasseurprofond"&&G[en].field[tfi]){G.fx.push({target:G[en].field[tfi].uid,bonus:-200,type:"atk",endOfTurn:true});addLog("Chasseur: -200 ATK !");}
      // Kaya des Glaces: cible gelée au prochain tour
      if(atk.id==="kayaglaces"&&G[en].field[tfi]){G.frozenChars.push(G[en].field[tfi].uid);addLog("Kaya: "+G[en].field[tfi].name+" gelé !");}
      // Arc Amazone: 100 dégâts à un autre ennemi
      if(atk.faction==="Amazones"){const eq=eqs(G[who].equips,atk.uid);if(eq.find(e=>e.id==="arcamazone")){const oi=G[en].field.findIndex((c,i)=>c&&i!==tfi);if(oi!==-1){const o=G[en].field[oi];const oh=curHp(o,G[en],G.fx,G.lieu)-100;if(oh<=0){killCard(en,oi);stealPrestige(who,"Arc: detruit "+o.name+"!");}else{G[en].field[oi]={...o,dmgTaken:(o.dmgTaken||0)+100};addLog("Arc Amazone: 100 degats a "+o.name);}}}}
      if(atk.id==="bjorn"){G[en].field.forEach((c,i)=>{if(!c||i===tfi||G.phase==="end"||!G[en].field[i])return;const ch2=curHp(G[en].field[i],G[en],G.fx,G.lieu);if(ch2<=300){if(100>=ch2){killCard(en,i);stealPrestige(who,"Bjorn detruit "+c.name+"!");}else{G[en].field[i]={...G[en].field[i],dmgTaken:(G[en].field[i].dmgTaken||0)+100};}}});}
    }
  }
  checkDeckOut();
};

const doPlayerAttack=(afi,ttype,tfi)=>{
  const atk=G.player.field[afi];
  if(!atk||atk.justPlayed){addLog("Ce personnage ne peut pas attaquer.");renderGame();return;}
  if(G.firstTurn){addLog("Impossible au 1er tour!");renderGame();return;}
  // Poison Paralysant: empoisonné + paralysé = ne peut pas attaquer
  if(atk._poisonParalysant&&atk._poisoned){addLog(atk.name+" est paralysé par le poison !");renderGame();return;}
  // Plan d'Infiltration: _multiAttack > 0 allows multiple attacks
  if(atk._multiAttack>0){
    if(ttype==="prestige"&&atk._canBypassField===false){addLog("Ce Ninja ne peut pas attaquer le prestige (Plan d'Infiltration)!");renderGame();return;}
    resolveCombat("player",afi,ttype,tfi);
    const fi=G.player.field.findIndex(c=>c&&c.uid===atk.uid);
    if(fi!==-1&&G.player.field[fi]){
      G.player.field[fi]={...G.player.field[fi],_multiAttack:atk._multiAttack-1,hasAttacked:atk._multiAttack<=1};
    }
    renderGame();return;
  }
  if(atk.hasAttacked){addLog("Ce personnage a déjà attaqué.");renderGame();return;}
  if(ttype==="prestige"&&G.ai.field.some(c=>c)&&!atk._canBypassField){addLog("L'IA a des personnages!");renderGame();return;}
  resolveCombat("player",afi,ttype,tfi);
  renderGame();
};

// Mekro: déclenche l'effet d'entrée d'une carte copiée (best-effort sur les effets connus)
const fireMekroCopiedEffect=(copiedId,casterUid)=>{
  const template=CARDS.find(c=>c.id===copiedId);
  if(!template)return;
  const mfi=G.player.field.findIndex(c=>c&&c.uid===casterUid);
  const placed=mfi!==-1?G.player.field[mfi]:null;
  if(!placed)return;
  addLog("⚙️ Mekro active le pouvoir copié de "+template.name+" !");
  // Effets sur les ennemis
  if(template.type==="personnage"){
    const enemies=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);
    // Cartes à dégâts multiples sur tous les ennemis (ex: Elythra, Sélène…)
    const allEnemyDmg={"selenemidiable":0,"elythraolympe":400};
    if(allEnemyDmg[copiedId]!==undefined){
      enemies.forEach(({c:t,i})=>{if(allEnemyDmg[copiedId]>0){t.dmgTaken+=allEnemyDmg[copiedId];const ch2=curHp(t,G.ai,G.fx,G.lieu);if(ch2<=0){killCard("ai",i);stealPrestige("player",t.name+" détruit !");}else addLog(template.name+": "+t.name+" -"+allEnemyDmg[copiedId]+" PV (copié)!");}});
      return;
    }
    // Gèle tous les ennemis
    if(copiedId==="selenemidiable"){G.ai.field.forEach(c=>{if(c)c._frozen=true;});addLog("Mekro → Sélène: tous gelés (copié) !");return;}
    // Effets qui nécessitent un choix (single target dmg, bounce, etc.)
    const needsEnemyTarget=["destructiontotale","missvoltibri","nikandros_target","bjirg_target","bjang_target","nyxara_target","aliblaze_target1","samira_target","bobi_bounce","ventiloide_bounce","virusinformatique","explosionbatterie","reprogrammationforcee"];
    if(needsEnemyTarget.includes(copiedId)&&enemies.length){
      setTimeout(()=>{CHOICE={type:"destructiontotale",options:enemies};renderGame();},100);return;
    }
    // Pioche de cartes
    const drawCards={"meliadardruche":()=>{const n=enemies.length;for(let i2=0;i2<n&&G.player.deck.length>0;i2++)G.player.hand.push(G.player.deck.shift());addLog("Mekro → Mélia: pioche "+n+" (copié)!");}};
    if(drawCards[copiedId]){drawCards[copiedId]();return;}
    // Soins d'alliés
    const healAll={"docrustine":()=>{G.player.field.forEach(c=>{if(c&&c.faction==="Punk")c.dmgTaken=Math.max(0,c.dmgTaken-200);});addLog("Mekro → Doc Rustine: Punk +200 PV (copié)!");}};
    if(healAll[copiedId]){healAll[copiedId]();return;}
  }
  // Fallback: juste le texte est copié, pas d'effet mécanique supplémentaire
  addLog("(Effet de "+template.name+" : "+template.effect+")");
};

    else if(id==="brulureacide"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"brulureacide",options:opts};renderGame();},100);return;}else addLog("Brûlure: aucune cible.");}

    else if(id==="fuitegaz"){[...G.ai.field].forEach((c,i)=>{if(!c)return;G.ai.field[i]=null;G.ai.equips[i]=[null,null];G.ai.hand.push({...c,uid:mkuid()});});addLog("💨 Fuite Gaz Vert: tous les ennemis renvoyés en main !");}
    else if(id==="poisonparalysant"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(opts.length){setTimeout(()=>{CHOICE={type:"poisonparalysant",options:opts};renderGame();},100);return;}else addLog("Poison Paralysant: aucun ennemi empoisonné.");}
    else if(id==="sporestouffe"){const opts=G.ai.field.map((c,i)=>({c,i})).filter(x=>x.c);if(opts.length){setTimeout(()=>{CHOICE={type:"sporestouffe",options:opts};renderGame();},100);return;}else addLog("Spores: aucune cible.");}
    else if(id==="rechercheantidote"){const allys=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c._poisoned);if(allys.length){G.dotEffects=G.dotEffects.filter(d=>d.uid!==allys[0].c.uid);allys[0].c._poisoned=false;addLog("🧪 Antidote: "+allys[0].c.name+" guéri !");}else addLog("Antidote: aucun allié empoisonné.");drawCard("player");drawCard("player");addLog("Antidote: +2 cartes piochées");}

    else if(id==="marchenoir"){const pool=G.player.deck.filter(c=>c.faction==="Empoisonneurs"||c.id==="brulureacide"||c.id==="injectiontoxique"||c.id==="fuitegaz"||c.id==="poisonparalysant"||c.id==="sporestouffe"||c.id==="rechercheantidote"||c.id==="recetteinterdite"||c.id==="marchenoir"||c.id==="decomposition"||c.id==="repassuspec"||c.id==="daguevenin"||c.id==="sarbacane"||c.id==="cannelame"||c.id==="technomasquepeste"||c.id==="fioletox"||c.id==="aiguillecontam"||c.id==="bombegaz");if(pool.length){const top=pool.map((c,i)=>({c,i:G.player.deck.findIndex(x=>x.uid===c.uid)}));setTimeout(()=>{CHOICE={type:"marchenoir",options:top.slice(0,5)};renderGame();},100);return;}else addLog("Marché Noir: deck vide / aucune carte Empoisonneur.");}

    addLog(card.name+" jouée.");

  } else if(card.type==="lieu"){
    G.player.hand.splice(ci,1);
    if(G.lieu)addLog(G.lieu.name+" remplacé!");
    G.lieu={...card,uid:mkuid()};addLog("Lieu: "+card.name);
  }
  renderGame();
};

// ── HANDLE CHOICE ──
window.doChoice=(action,payload)=>{
  const ch=CHOICE;CHOICE=null;
  if(ch.type==="clankbeak"){if(action==="bottom"&&G.player.deck.length>0){const[t,...r]=G.player.deck;G.player.deck=[...r,t];}}
  else if(ch.type==="ile"){if(action==="draw"){drawCard("player");addLog("Pioche 1!");}else if(action==="steal"){const st=G.ai.hand.splice(payload,1)[0];G.player.hand.push({...st,uid:mkuid()});addLog("Vous volez "+st.name+"!");}}
  else if(ch.type==="explosion"){if(action==="lieu"){addLog(G.lieu.name+" détruit!");G.lieu=null;}else if(action==="equip"){const{fi,ei}=payload;const eq=G.ai.equips[fi][ei];G.ai.equips[fi][ei]=null;addLog(eq.name+" détruit!");}}
  else if(ch.type==="volpuissance_my"){CHOICE={...ch,type:"volpuissance_en",myPick:payload};renderGame();return;}
  else if(ch.type==="volpuissance_en"){const myC=G.player.field[ch.myPick];const enC=G.ai.field[payload];if(myC&&enC){G.fx.push({target:myC.uid,bonus:200,type:"atk",endOfTurn:true},{target:enC.uid,bonus:-200,type:"atk",endOfTurn:true});addLog("Vol: "+myC.name+" +200, "+enC.name+" -200 ATK!");}}
  else if(ch.type==="eirik"&&action==="top"){if(G.player.deck.length>=2){const[a,b,...r]=G.player.deck;G.player.deck=payload===0?[a,...r,b]:[b,...r,a];addLog("Eirik réorganise le deck.");}}

    } else if(action==="pickAlly"){
      const t=G.player.field[payload];

    else if(action==="confirm"){const dmg=ch.type==="dragon_venin"?150:100;const turns=ch.type==="dragon_venin"?-1:3;(ch.selected||[]).forEach(i=>{const t=G.ai.field[i];if(t){poisonChar("ai",t.uid,dmg,turns);addLog("☠ "+(ch.type==="dragon_venin"?"Dragon":"Sylvara")+": "+t.name+" empoisonné(e) !");}});}

  else if(ch.type==="casque_target"){const t=G.ai.field[payload];if(t){t.dmgTaken+=100;addLog("Casque Bélier: "+t.name+" -100 PV !");const ch2=curHp(t,G.ai,G.fx,G.lieu);if(ch2<=0){killCard("ai",payload);stealPrestige("player",t.name+" détruit par Casque !");}}}
  else if(ch.type==="micro_freeze"){const t=G.ai.field[payload];if(t){t._frozen=true;addLog("Micro: "+t.name+" gelé (prochain tour) !");}}

// ── SYSTÈME DE SORTS — Fonctions ──
window.openSortModal=()=>{
  if(!G||G.phase!=="player"||G.sortUsedThisTurn||CHOICE||ANIM_BUSY)return;
  const fieldCards=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c);
  if(!fieldCards.length){addLog("Aucun personnage sur le terrain !");return;}
  CHOICE={type:"sort_pick_target",fieldCards};renderGame();
};

window.openEvoModal=()=>{
  if(!G||G.phase!=="player"||CHOICE||ANIM_BUSY)return;
  const evos=G.player.field.map((c,i)=>{
    const sort=G.sortActivations?.[i];
    if(!c||!sort)return null;
    const evo=getEvolution(c.id,sort);
    if(!evo||G.turn<evo.cost)return null;
    return{c,i,sort,evo};
  }).filter(Boolean);
  if(!evos.length){addLog("Aucune évolution disponible.");return;}
  CHOICE={type:"sort_evolve_pick",options:evos};renderGame();
};

window.doEndTurn=()=>{
  if(!G||G.phase!=="player"||CHOICE||ANIM_BUSY)return;
  // ── TRIO NINJA: proposer rappel en fin de tour ──────────
  const ninjaCount=G.player.field.filter(c=>c&&c.faction==="Ninjas").length;
  if(ninjaCount>=3&&G.ninjaTrio){
    G.ninjaTrio=false;// consomme le trigger
    const ninjaOpts=G.player.field.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.faction==="Ninjas");
    CHOICE={type:"ninja_trio_recall",options:ninjaOpts};
    renderGame();return;
  }
  // ── NOUVELLES CARTES — effets de fin de tour joueur ──
  // Maître Phyllobate: chaque ennemi empoisonné inflige 100 dégâts à ses alliés adjacents
  if(G.player.field.some(c=>c&&c.id==="maitrephyllobate")){
    G.ai.field.forEach((c,i)=>{
      if(!c||!c._poisoned)return;
      [-1,1].forEach(d=>{const j=i+d;const adj=G.ai.field[j];if(adj){adj.dmgTaken=(adj.dmgTaken||0)+100;addLog("Phyllobate: "+adj.name+" -100 PV (adjacent à "+c.name+") !");const adjHp=curHp(adj,G.ai,G.fx,G.lieu);if(adjHp<=0)killCard("ai",j);}});
    });
  }
  // Kro-Mur: reset (son effet bloque 1 action IA; géré par G.kroBlockAI)
  G.phase="ai";G.firstTurn=false;SELECTED_HAND=null;ATTACK_MODE=false;ATTACK_FROM=null;
  addLog("IA joue...");
  renderGame();// Show "IA joue..." immediately
  AI_ANNOUNCE_QUEUE=[];
  drawCard("ai");
  G.frozenAI=false;
  // ── DOTS: Apply AI-side poison (effects on AI chars at start of AI turn) ──
  applyDotEffects("ai");
  if(G.phase==="end"){renderGame();return;}
  // ── TRIO SYNERGY IA ──
  checkTrioSynergy("ai");
  // Parthénon: +150 PV à tous les Grecs du joueur pendant le tour adverse
  if(G.lieu&&G.lieu.id==="parthenon"){
    G.player.field.forEach(c=>{if(c&&c.faction==="Grecs"){G.fx.push({target:c.uid,bonus:150,type:"hp",endOfTurn:true});}});
    addLog("Parthénon: tous vos Grecs +150 PV ce tour !");
  }
  G.fx=G.fx.filter(e=>!e.endOfTurn).map(e=>{
    if(e.turnsLeft!==undefined){
      if(e.turnsLeft<=1)return null;
      return{...e,turnsLeft:e.turnsLeft-1};
    }
    return e;
  }).filter(Boolean);
  G.sirenesTarget=null;
  G.player.field.forEach(c=>{if(c&&c.id==="nayra")c.nayraUsed=false;});
  G.ai.field.forEach(c=>{if(c&&c.id==="nayra")c.nayraUsed=false;});
  // Fureur end of turn
  if(G.fureurTarget){
    const fi=G.player.field.findIndex(c=>c&&c.uid===G.fureurTarget);
    if(fi!==-1){const c=G.player.field[fi];const ch=curHp(c,G.player,[],G.lieu);if(200>=ch){killCard("player",fi);addLog("Fureur: "+c.name+" détruit!");}else{c.dmgTaken=(c.dmgTaken||0)+200;addLog("Fureur: -200 PV.");}}
    G.fureurTarget=null;
  }
  const prevFrozen=[...G.frozenChars];G.frozenChars=[];
  G.player.field.forEach(c=>{if(c)c.justPlayed=false;});

  const diff=MATCHUP?.difficulty||"moyen";

  // ── AI PLAY CHARS ──────────────────────────────────────
  const handToPlay=[...G.ai.hand];
  if(diff==="difficile")handToPlay.sort((a,b)=>(b.cost||0)-(a.cost||0));
  else if(diff==="facile")handToPlay.sort((a,b)=>(a.cost||0)-(b.cost||0));

  for(let hi=0;hi<handToPlay.length;hi++){
    const c=handToPlay[hi];if(!c||c.type!=="personnage"||c.cost>G.turn)continue;
    if(c.isFusion)continue;
    // Voltark Roi des Hyènes: bloque l'invocation des ennemis de coût ≤3
    if((c.cost||0)<=3&&G.player.field.some(f=>f&&f.id==="voltarkroideshyenes")){
      addLog("🎸 Voltark bloque l'invocation de "+c.name+" (coût ≤3) !");continue;
    }
    const slot=G.ai.field.findIndex(f=>!f);if(slot===-1)break;
    const placed={...c,dmgTaken:0,hasAttacked:false,justPlayed:true,bonusAtk:0,bonusHp:0,uid:mkuid()};
    G.ai.field[slot]=placed;
    // Hotep Piège-Pas: chaque ennemi invoqué arrive avec 50 PV en moins
    if(G.player.field.some(f=>f&&f.id==="hoteppiegepas")){
      G.ai.field[slot].dmgTaken=(G.ai.field[slot].dmgTaken||0)+50;
      addLog("⚠️ Hotep: "+G.ai.field[slot].name+" arrive avec -50 PV !");
    }
    const idx=G.ai.hand.findIndex(x=>x.uid===c.uid);
    if(idx!==-1)G.ai.hand.splice(idx,1);
    addLog("IA pose: "+c.name);
    queueAiAnnounce(
      "L'adversaire invoque",
      "play",
      `<strong style="color:#f0c060">${c.name}</strong>${c.faction?` · ${c.faction}`:""}${c.atk?`<br>⚔️ ${c.atk} ATK  ❤️ ${c.hp} PV`:""}`,
      1800
    );
    // Entry effects
    if(c.id==="zyra"){queueAiAnnounce(`${c.name} : détruit toutes les cartes coût ≤2 !`,"power","Pouvoir d'entrée",1400);["player","ai"].forEach(w=>{G[w].field.forEach((x,j)=>{if(x&&x.cost<=2){killCard(w,j);stealPrestige("ai","Zyra détruit "+x.name+"!");}});});}
    if(c.id==="hurgan"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){const t=G.player.field[ti];G.player.field[ti]=null;G.player.equips[ti]=[null,null];G.player.hand.push({...t,uid:mkuid()});queueAiAnnounce(`${c.name} renvoie ${t.name} en main !`,"effect","Pouvoir d'entrée",1400);addLog("Hurgan IA: "+t.name+" renvoyé!");}}
    if(c.id==="freyja"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-200,type:"atk",endOfTurn:true});queueAiAnnounce(`${c.name} affaiblit ${G.player.field[ti].name} de 200 ATK`,"effect","",1200);addLog("Freyja IA: -200 ATK!");}}
    if(c.id==="haldor"||c.id==="ylvabaies"){const al=G.ai.field.filter((x,j)=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){al[0].bonusHp=(al[0].bonusHp||0)+100;queueAiAnnounce(`${al[0].name} gagne +100 PV !`,"effect","Synergie Viking",1200);}}
    if(c.id==="petittorvald"){const al=G.ai.field.filter((x,j)=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){G.fx.push({target:al[0].uid,bonus:100,type:"atk",endOfTurn:true});queueAiAnnounce(`${al[0].name} gagne +100 ATK !`,"effect","Synergie Viking",1200);}}
    if(c.id==="astrid"){const al=G.ai.field.filter(x=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(al.length){G.fx.push({target:al[0].uid,bonus:200,type:"atk",endOfTurn:true});queueAiAnnounce(`${al[0].name} gagne +200 ATK !`,"effect","Astrid",1200);}}
    if(c.id==="kaya"){const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-200,type:"atk",endOfTurn:true});const hov=G.ai.field.some(x=>x&&x.faction==="Vikings"&&x.uid!==placed.uid);if(hov)G.fx.push({target:placed.uid,bonus:200,type:"atk",endOfTurn:true});queueAiAnnounce(`Kaya affaiblit ${G.player.field[ti].name} de 200 ATK`,"effect","",1200);}}
    if(c.id==="porteur"){const eq=G.ai.deck.find(x=>x.type==="equipement");if(eq){G.ai.deck=G.ai.deck.filter(x=>x.uid!==eq.uid);G.ai.hand.push(eq);queueAiAnnounce(`${c.name} pioche un équipement`,"effect","",1200);}}
  }

  // ── AI PLAY EQUIPMENT ─────────────────────────────────
  const eqChance=diff==="facile"?0:diff==="moyen"?0.5:1;
  G.ai.hand.filter(c=>c&&c.type==="equipement").forEach(c=>{
    if(Math.random()>eqChance)return;
    const target=G.ai.field.find(f=>f&&f.faction===c.faction);
    if(!target)return;
    const tfi=G.ai.field.findIndex(f=>f&&f.uid===target.uid);
    const eSlot=G.ai.equips[tfi].findIndex(e=>!e);
    if(eSlot===-1)return;
    G.ai.equips[tfi][eSlot]=c;
    G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);
    addLog("IA équipe: "+c.name+" sur "+target.name);
    queueAiAnnounce(`Équipe ${target.name}`,`power`,`🛡️ ${c.name}`,1300);
  });

  // ── AI PLAY ACTIONS ───────────────────────────────────
  // facile: never plays actions. moyen: plays ~1 action. difficile: plays all useful actions
  const maxActions=diff==="facile"?0:diff==="moyen"?1:99;
  let actionsPlayed=0;
  const aiActions=[...G.ai.hand.filter(c=>c&&c.type==="action")];
  // Sort: difficile prioritizes offensive actions
  if(diff==="difficile")aiActions.sort((a,b)=>{
    const priority=["planche","bombe","abordage","explosion","cataclysme","tempetesable","colerara","appeldieux","fureurberserker","benedictionpere","fracastonneroc","frappetonnerre"];
    return priority.indexOf(b.id)-priority.indexOf(a.id);
  });

  for(const c of aiActions){
    if(actionsPlayed>=maxActions)break;
    // Kro-Mur Graffeur: annule la prochaine action adverse
    if(G.player.field.some(f=>f&&f.id==="kromurgraffeur")){
      addLog("Kro-Mur: l'action IA '"+c.name+"' est annulée !");
      G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);
      G.ai.discard.push(c);
      // Kro-Mur ne bloque qu'une seule action - on retire la carte Kro-Mur du terrain après
      const kIdx=G.player.field.findIndex(f=>f&&f.id==="kromurgraffeur");
      if(kIdx!==-1){addLog("Kro-Mur a utilisé son pouvoir et disparaît !");killCard("player",kIdx);}
      continue;
    }
    if(G.arcaneBreaker){G.arcaneBreaker=false;addLog("Briseur annule "+c.name+"!");G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);continue;}
    let played=false;
    const playerField=G.player.field.filter(x=>x);
    const aiField=G.ai.field.filter(x=>x);
    const weakestPlayer=playerField.length?playerField.reduce((a,b)=>curHp(a,G.player,G.fx,G.lieu)<curHp(b,G.player,G.fx,G.lieu)?a:b):null;
    const strongestAI=aiField.length?aiField.reduce((a,b)=>calcAtk(a,G.ai,G.fx,G.lieu,false)>calcAtk(b,G.ai,G.fx,G.lieu,false)?a:b):null;
    const weakestAI=aiField.length?aiField.reduce((a,b)=>curHp(a,G.ai,G.fx,G.lieu)<curHp(b,G.ai,G.fx,G.lieu)?a:b):null;

    // Offensive actions targeting player
    if(c.id==="planche"||c.id==="impactcible"){
      const ti=G.player.field.findIndex(x=>x&&curHp(x,G.player,G.fx,G.lieu)<=400);
      if(ti!==-1){const name=G.player.field[ti].name;killCard("player",ti);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);played=true;}
    } else if(c.id==="abordage"||c.id==="frappenforcee"||c.id==="iskra"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:200,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +200 ATK!");queueAiAnnounce(`${c.name} — ${strongestAI.name} +200 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="benedictionpere"){
      const v=G.ai.field.find(x=>x&&x.faction==="Vikings");if(v){G.fx.push({target:v.uid,bonus:200,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +200!");queueAiAnnounce(`Bénédiction du Père — ${v.name} +200 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="bombe"||c.id==="explosion"){
      if(playerField.length){
        const pfi=G.player.field.findIndex(x=>x&&curHp(x,G.player,G.fx,G.lieu)<=300);
        if(pfi!==-1){const name=G.player.field[pfi].name;killCard("player",pfi);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);played=true;}
        else if(weakestPlayer){const pfi2=G.player.field.indexOf(weakestPlayer);const ch=curHp(weakestPlayer,G.player,G.fx,G.lieu)-200;if(ch<=0){const name=weakestPlayer.name;killCard("player",pfi2);stealPrestige("ai",c.name+": détruit!");queueAiAnnounce(`${c.name} détruit ${name} !`,"destroy","",1400);}else{G.player.field[pfi2]={...weakestPlayer,dmgTaken:(weakestPlayer.dmgTaken||0)+200};addLog("IA "+c.name+": -200 PV!");queueAiAnnounce(`${c.name} inflige 200 dégâts à ${weakestPlayer.name} !`,"damage","",1300);}played=true;}
      }
    } else if(c.id==="cataclysme"){
      [...G.player.field].forEach((x,j)=>{if(x&&curHp(x,G.player,G.fx,G.lieu)<=200){const name=x.name;killCard("player",j);stealPrestige("ai","Cataclysme: "+name+"!");}});queueAiAnnounce(`Cataclysme — détruit tous les personnages blessés !`,"destroy","",1400);played=true;
    } else if(c.id==="tempetesable"||c.id==="eclipsera"){
      G.player.field.forEach(x=>{if(x)G.fx.push({target:x.uid,bonus:-200,type:"atk",endOfTurn:true});});addLog("IA "+c.name+": tous -200 ATK!");queueAiAnnounce(`${c.name} — tous vos personnages -200 ATK !`,"effect","",1400);played=true;
    } else if(c.id==="fureurberserker"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:400,type:"atk",endOfTurn:true});G.fureurTarget=strongestAI.uid;addLog("IA Fureur: +400 ATK!");queueAiAnnounce(`Fureur Berserker — ${strongestAI.name} +400 ATK !`,"power","⚠️ Perdra 200 PV à la fin du tour",1500);played=true;}
    } else if(c.id==="frappetonnerre"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:300,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +300!");queueAiAnnounce(`${c.name} — ${strongestAI.name} +300 ATK !`,"power","",1300);played=true;}
    } else if(c.id==="appeldieux"){
      G.ai.field.forEach(x=>{if(x&&x.faction==="Egyptiens")G.fx.push({target:x.uid,bonus:200,type:"atk",endOfTurn:true});});addLog("IA Appel des Dieux!");queueAiAnnounce(`Appel des Dieux — tous les Égyptiens +200 ATK !`,"power","",1400);played=true;
    } else if(c.id==="surcroit"){
      if(weakestAI){G.fx.push({target:weakestAI.uid,bonus:200,type:"hp",endOfTurn:false});addLog("IA Surcroît: +200 PV!");queueAiAnnounce(`Surcroît — ${weakestAI.name} +200 PV !`,"effect","",1300);played=true;}
    } else if(c.id==="fracastonneroc"){
      const ti=G.player.field.findIndex(x=>x);if(ti!==-1){G.fx.push({target:G.player.field[ti].uid,bonus:-300,type:"atk",endOfTurn:true});addLog("IA Fracas: -300 ATK!");played=true;}
    } else if(c.id==="chargespartiate"||c.id==="pluiejavelots"){
      if(strongestAI){G.fx.push({target:strongestAI.uid,bonus:300,type:"atk",endOfTurn:true});addLog("IA "+c.name+": +300!");played=true;}
    } else if(c.id==="colerezeus"){
      const ti=G.player.field.findIndex(x=>x);if(ti!==-1){const t=G.player.field[ti];const ch=curHp(t,G.player,G.fx,G.lieu);if(300>=ch){killCard("player",ti);stealPrestige("ai","Colère Zeus: détruit!");}else{G.player.field[ti]={...t,dmgTaken:(t.dmgTaken||0)+300};}played=true;}
    } else if(c.id==="reveilcolosse"){
      G.ai.field.forEach(x=>{if(x&&x.faction==="Grecs")G.fx.push({target:x.uid,bonus:200,type:"hp",endOfTurn:true});});addLog("IA Réveil Colosse: +200 PV!");played=true;
    }

    if(played){G.ai.hand=G.ai.hand.filter(x=>x.uid!==c.uid);actionsPlayed++;}
  }

  // ── AI ATTACKS ────────────────────────────────────────
  // difficile: attacks weakest player first to get kills, moyen: normal, facile: random target
  G.ai.field.forEach((atk,i)=>{
    if(!atk||G.frozenAI||atk.hasAttacked||prevFrozen.includes(atk.uid)||G.phase==="end")return;
    // Grève des Ouvriers: paralysie temporaire
    if(atk._greve&&atk._greve>0){atk._greve--;addLog("🪧 Grève: "+atk.name+" paralysé ce tour.");return;}
    const ptgts=G.player.field.map((c,pi)=>({c,i:pi})).filter(x=>x.c&&!(x.c._nikoProtectExpires&&G.turn<=x.c._nikoProtectExpires&&(atk.cost||0)>4));
    let ttype="prestige",tfi=-1;
    if(ptgts.length>0){
      let forcedTarget=null;
      if(G.sirenesTarget&&G.sirenesTarget.enemyUid===atk.uid){
        const si=G.player.field.findIndex(c=>c&&c.uid===G.sirenesTarget.sireneUid);
        if(si!==-1)forcedTarget=si;
        G.sirenesTarget=null;
      }
      if(forcedTarget!==null){ttype="field";tfi=forcedTarget;}
      else{
        // Maru Muraille Ronde: force AI to target Maru if present
        const maruI=G.player.field.findIndex(c=>c&&c.id==="marumuraille");
        if(maruI!==-1){ttype="field";tfi=maruI;}
        else if(diff==="difficile"){
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const killable=pool.find(({c})=>calcAtk(atk,G.ai,G.fx,G.lieu,false)>=curHp(c,G.player,G.fx,G.lieu));
          const chosen=killable||pool.reduce((b,x)=>curHp(x.c,G.player,G.fx,G.lieu)<curHp(b.c,G.player,G.fx,G.lieu)?x:b);
          ttype="field";tfi=chosen.i;
        } else if(diff==="facile"){
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const rand=pool[Math.floor(Math.random()*pool.length)];
          ttype="field";tfi=rand.i;
        } else {
          const validTgts=ptgts.filter(({c})=>!c._mokuProtected);
          const pool=validTgts.length?validTgts:ptgts;
          const t=pool.reduce((b,x)=>curHp(x.c,G.player,G.fx,G.lieu)<curHp(b.c,G.player,G.fx,G.lieu)?x:b);
          ttype="field";tfi=t.i;
        }
      }
    }
    if(G.phase!=="end"){
      const tgtName=ttype==="field"&&G.player.field[tfi]?G.player.field[tfi].name:"vos points de Prestige";
      const beforeHp=ttype==="field"&&G.player.field[tfi]?curHp(G.player.field[tfi],G.player,G.fx,G.lieu):null;
      resolveCombat("ai",i,ttype,tfi);
      if(G.phase!=="end"){
        // Check if target survived or was destroyed
        const targetDied=ttype==="field"&&!G.player.field[tfi];
        if(targetDied){
          queueAiAnnounce(`${atk.name} détruit ${tgtName} !`,"destroy",`⚔️ ${calcAtk(atk,G.ai,G.fx,G.lieu,false)} ATK`,1600);
        } else if(ttype==="prestige"){
          queueAiAnnounce(`${atk.name} attaque votre Prestige !`,"attack","",1300);
        } else {
          const afterHp=ttype==="field"&&G.player.field[tfi]?curHp(G.player.field[tfi],G.player,G.fx,G.lieu):null;
          const dmgDone=beforeHp&&afterHp?beforeHp-afterHp:null;
          queueAiAnnounce(
            `${atk.name} attaque ${tgtName}`,
            "attack",
            dmgDone?`${tgtName} perd ${dmgDone} PV (→ ${afterHp} restants)`:"",
            1500
          );
        }
      }
    }
  });
  // Reset Moku protection and Yumi ATK at start of NEXT player turn (done in turn start)

  if(G.phase!=="end"){
    G.turn++;G.phase="player";
    drawCard("player");
    // ── DOTS: Apply player-side poison (effects on player chars at start of player turn) ──
    applyDotEffects("player");
    if(G.phase==="end"){renderGame();return;}
    G.player.field.forEach(c=>{if(c){c.hasAttacked=false;c._brasUsed=false;}});
    G.ai.field.forEach(c=>{if(c){c.hasAttacked=false;c.justPlayed=false;}});
    addLog("Tour "+G.turn+" — Votre tour!");
    checkTrioSynergy("player");
    if(G.lieu&&G.lieu.id==="villagenil"){G.player.field.forEach(c=>{if(c&&c.faction==="Egyptiens"){c.dmgTaken=Math.max(0,(c.dmgTaken||0)-100);}});addLog("Village du Nil: Egyptiens +100 PV!");}
    if(G.lieu&&G.lieu.id==="villagetipis"){G.player.field.forEach(c=>{if(c&&c.faction==="Amerindiens"&&c.dmgTaken>0){c.dmgTaken=Math.max(0,c.dmgTaken-100);}});addLog("Village des Tipis: Amérindiens blessés +100 PV!");}
    if(G.lieu&&G.lieu.id==="canyonesprits")G.lieu.canyonUsed=false;
    if(G.player.field.some(c=>c&&c.id==="pretresselune")){G.player.field.forEach(c=>{if(c&&c.faction==="Amerindiens"){c.dmgTaken=Math.max(0,(c.dmgTaken||0)-150);}});addLog("Prêtresse: tous Amérindiens +150 PV!");}
    G.player.field.forEach(c=>{if(c&&c.id==="portepeaux")c.portepeauxUsed=false;});
    G.ai.field.forEach(c=>{if(c&&c.id==="portepeaux")c.portepeauxUsed=false;});
    G.egyptShield=false;
    G.artemisTarget=null;
    if(G.lieu&&G.lieu.id==="olympe")G.lieu.olympeUsedTurn=null;
    // ── ROBOTS HUMANOÏDES — effets de début de tour ──
    G._ignisUsed=false;// Reset Ignis bouclier
    G._usineUsed=false;// Reset Usine de Production
    G.robotShield=false;// Reset Robot shield (1x/tour)
    G.robotShieldAi=false;
    G.player.field.forEach(c=>{if(c)c._alpinoxTriggered=false;});// Reset Alpinox
    // Florabot Jardinier: 1x/tour, soigne un allié de 100 PV (+ Robot +50 ATK)
    const florabot=G.player.field.find(c=>c&&c.id==="florabotjardinier");
    if(florabot){
      const targets=G.player.field.filter(c=>c&&c.uid!==florabot.uid&&c.type==="personnage");
      if(targets.length>0){
        const t=targets[0];
        t.dmgTaken=Math.max(0,t.dmgTaken-100);
        if(t.faction==="Robots"){t.bonusAtk=(t.bonusAtk||0)+50;addLog("Florabot: "+t.name+" +100 PV +50 ATK !");}
        else addLog("Florabot: "+t.name+" +100 PV !");
      }
    }
    // Cassia Canon: tous les Grecs alliés +50 ATK ce tour
    G.player.field.forEach(c=>{if(c&&c.id==="cassiacanon"){
      G.player.field.forEach(ally=>{if(ally&&ally.faction==="Grecs")G.fx.push({target:ally.uid,bonus:50,type:"atk",endOfTurn:true});});
      addLog("🏛️ Cassia Canon: tous les Grecs +50 ATK !");
    }});
    // K-9 Sécuribot: active le double-attaque si le tour correspond
    G.player.field.forEach(c=>{if(c&&c._pendingDoubleAttack){c._pendingDoubleAttack=false;c._doubleAttack=true;addLog("K-9: "+c.name+" peut attaquer 2 fois !");}});
    // Punk aux Mille Voix: déclenche un choix au début du tour
    if(G.player.field.some(f=>f&&f.id==="punkauxmillevoix")&&G.ai.field.some(c=>c)){
      setTimeout(()=>{CHOICE={type:"punkmillevoix_choice"};renderGame();},200);
    };
    // Miyu: expire les debuffs ATK périmés
    G.fx=G.fx.filter(f=>!f.expiresAtTurn||G.turn<=f.expiresAtTurn);
    // Sorts: reset activation disponible
    G.sortUsedThisTurn=false;
    // Mémé Nocturne: se soigne de 50 PV par allié Magie noire sur le terrain
    G.player.field.forEach(c=>{
      if(c&&c.id==="memenocturne"){
        const allies=G.player.field.filter(x=>x&&x.faction==="MagesNoirs").length;
        if(allies>0){const heal=allies*50;c.dmgTaken=Math.max(0,c.dmgTaken-heal);addLog("Mémé Nocturne: +"+heal+" PV ("+allies+" allié(s) Magie noire) !");}
      }
    });
    // Cathédrale Mère de l'IA: tous les Robots +100 ATK
    if(G.lieu&&G.lieu.id==="cathedralemereia"){
      G.player.field.forEach(c=>{if(c&&c.faction==="Robots"){G.fx.push({target:c.uid,bonus:100,type:"atk",endOfTurn:true});}});
      addLog("🏛️ Cathédrale: tous les Robots +100 ATK ce tour !");
    }
    // Griffes de Plasma: -100 PV au porteur
    G.player.field.forEach((c,i)=>{
      if(!c)return;
      const hasGriffes=eqs(G.player.equips,c.uid).find(e=>e&&e.id==="griffesplasma");
      if(hasGriffes){
        const ch2=curHp(c,G.player,G.fx,G.lieu);
        if(ch2<=100){killCard("player",i);stealPrestige("ai","Griffes de Plasma détruit "+c.name+" !");}
        else{G.player.field[i]={...c,dmgTaken:(c.dmgTaken||0)+100};addLog("⚔️ Griffes de Plasma: "+c.name+" −100 PV (coût du pouvoir) !");}
      }
    });
    // Bouclier Holographique expiry: retirer le bonus au tour adverse (G.turn = AI)
    G.player.field.forEach(c=>{if(c&&c._bouclierholo&&G.turn>=c._bouclierholo){c.bonusHp=Math.max(0,(c.bonusHp||0)-400);c._bouclierholo=null;addLog("🛡️ Bouclier Holo: bonus PV expiré pour "+c.name);}}); 
    // Reset Ninja flags
    G.player.field.forEach(c=>{if(c){c._mokuProtected=false;c._yumiZero=false;c._canBypassField=false;c._technomaskUsed=false;}});
    G.maruTauntUid=null;G.marqueTarget=null;G.fumigUsedTurn=false;
    G.lieu&&(G.lieu.jardinUsed=false);G.lieu&&(G.lieu.usineUsed=false);
    G.laboCooldown=false;G.ninjaTrio=false;
    G.empoisonneurTrio=G.player.field.filter(c=>c&&c.faction==="Empoisonneurs").length>=3;
    // Manoir du Baron: début de tour → pioche 1 + remets 1 si Steampunk équipé
    if(G.lieu&&G.lieu.id==="manoirbaron"&&G.player.field.some((c,j)=>c&&c.faction==="Steampunk"&&eqs(G.player.equips,c.uid).find(e=>e))){
      drawCard("player");
      if(G.player.hand.length>0){setTimeout(()=>{CHOICE={type:"manoir_remise",options:G.player.hand.map((c,i)=>({c,i}))};renderGame();},200);}
    }
    // Apply Kunai poison DoT
    G.fx=G.fx.map(e=>{
      if(e.type==="poison"&&e.turnsLeft!==undefined){
        const fi=G.ai.field.findIndex(c=>c&&c.uid===e.target);
        if(fi!==-1){const ch=curHp(G.ai.field[fi],G.ai,G.fx.filter(x=>x!==e),G.lieu);if(100>=ch){killCard("ai",fi);stealPrestige("player","Kunai poison détruit "+G.ai.field[fi]?.name||"ennemi"+"!");}else if(G.ai.field[fi]){G.ai.field[fi]={...G.ai.field[fi],dmgTaken:(G.ai.field[fi].dmgTaken||0)+100};addLog("Poison Kunai: -100 PV !");}}
        return null;
      }
      return e;
    }).filter(Boolean);
    checkDeckOut();
  }
  // Show AI actions progressively, then renderGame
  flushAiAnnounce(()=>{renderGame();});
};

// ═══════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════
render();
</script>
